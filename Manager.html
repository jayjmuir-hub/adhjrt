<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADH JRT — Manager Dashboard</title>
<meta name="description" content="Manager dashboard for the Abu Dhabi Harlequins Junior Rugby Tournament.">

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C0C0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADH JRT">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ADH JRT — Manager Dashboard
   Follows app.html's plain-HTML/module-script architecture (not
   the .dc.html reactive-component engine Organizer.dc.html and
   Scores & Standings.dc.html use) — see task-3-brief.md for why.
   Palette variables and .card/.btn/.field/.err classes below are
   copied verbatim from app.html; the .mgr-login* rules are new,
   giving this page an Organizer-style full-page sign-in instead
   of app.html's bottom sheet.
   ============================================================ */
:root{
  /* JRT palette — Akuma kit, matching adhjrt.com */
  --red:#E11B22; --red-deep:#A81219; --green:#17A34A; --green-deep:#0F7A36;
  --ink:#0C0C0E; --paper:#F3F1ED; --card:#ffffff; --line:#e2ded4;
  --muted:#77726e; --text:#14151A;
  --good:#17A34A; --good-bg:#e8f6ec; --warn:#c9861a; --warn-bg:#fbf1dd;
  --shadow:0 6px 24px rgba(12,12,14,.10); --shadow-sm:0 2px 8px rgba(12,12,14,.08);
  --radius:16px; --radius-sm:11px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--paper);color:var(--text);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font-family:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer;color:inherit}
a{color:inherit}

/* ---------- building blocks (verbatim from app.html) ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
      border:1px solid var(--line);overflow:hidden}
.muted{color:var(--muted)}

label{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
      color:var(--muted);margin-bottom:6px}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
             background:#fff;color:var(--text);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--red)}
.field{margin-bottom:15px}
.btn{width:100%;padding:14px;border-radius:11px;font-weight:800;font-size:15px;
     text-transform:uppercase;letter-spacing:.5px;text-align:center;display:block}
.btn-p{background:var(--red);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.err{background:#fbeae8;color:#a3271b;padding:11px 13px;border-radius:10px;font-size:13.5px;
     font-weight:600;margin-bottom:14px}
.ok{background:var(--good-bg);color:var(--green-deep);padding:11px 13px;border-radius:10px;
    font-size:13.5px;font-weight:600;margin-bottom:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;
       pointer-events:none;
       bottom:calc(env(safe-area-inset-bottom) + 28px);background:var(--ink);color:#fff;
       padding:12px 20px;border-radius:100px;font-weight:600;font-size:14px;z-index:80;
       transition:transform .22s ease-out,opacity .22s ease-out;
       box-shadow:var(--shadow);max-width:88vw;text-align:center;line-height:1.35}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.spin{padding:40px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- login screen (new — full-page, Organizer-style) ---------- */
.mgr-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.mgr-login-card{width:100%;max-width:380px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:32px 26px;border:1px solid var(--line)}
.mgr-login-k{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--green);margin-bottom:6px}
.mgr-login-h{font-family:'Anton';font-size:26px;text-transform:uppercase;margin-bottom:22px}

/* ---------- dashboard chrome (new — top tab bar, not app.html's bottom nav) ---------- */
.mgr-shell{max-width:960px;margin:0 auto;min-height:100vh}
.mgr-topbar{background:var(--ink);display:flex;align-items:center;gap:12px;padding:10px 16px}
.mgr-topbar a{font-size:12px;font-weight:700;color:#aeb4bf;text-decoration:none;
  display:inline-flex;align-items:center;gap:4px}
.mgr-topbar a:hover{color:#fff}
.mgr-tabs{position:sticky;top:0;z-index:40;background:var(--ink);display:flex;gap:4px;
  align-items:flex-start;padding:14px 16px 0;overflow-x:auto}
.mgr-tabs .mgr-tab-list{display:flex;gap:4px;flex:1}
.mgr-tabs button{padding:12px 20px;border-radius:10px 10px 0 0;font-weight:800;font-size:15px;
  color:#aeb4bf;white-space:nowrap;letter-spacing:.3px}
.mgr-tabs button.on{background:var(--paper);color:var(--ink)}
.mgr-signout{flex:none;padding:12px 14px !important;font-size:12px !important;
  font-weight:700 !important;color:#aeb4bf !important;text-transform:none !important;
  letter-spacing:0 !important}
.mgr-signout:hover{color:#fff !important}
.mgr-main{padding:20px 16px 60px}

/* ---------- "today" view building blocks (verbatim from app.html lines 96-149) ---------- */
.sec-t{font-family:'Anton';font-size:19px;text-transform:uppercase;letter-spacing:.4px;
       margin:22px 2px 10px;color:var(--ink);display:flex;align-items:center;gap:10px}
.sec-t::before{content:"";flex:none;width:26px;height:4px;border-radius:2px;background:var(--green)}
.sec-t:first-child{margin-top:4px}

/* match rows */
.mrow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;
      padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-child{border-top:none}
.mtime{font-weight:800;color:var(--red);font-size:13px}
.mpitch{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.mteams{font-weight:600;font-size:14.5px;line-height:1.4}
.mmeta{font-size:11px;color:var(--muted);margin-top:3px}
.mscore{font-family:'Anton';font-size:19px;color:var(--ink);white-space:nowrap}
.chev{color:#c6c2bc}

.empty{padding:34px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:'Anton';font-size:22px;color:var(--ink);
         text-transform:uppercase;margin-bottom:8px}

/* ---------- score-entry sheet (verbatim from app.html lines 205-239, 164-172) ---------- */
.sheet-scrim{position:fixed;inset:0;background:rgba(12,12,14,.5);z-index:60;opacity:0;
             pointer-events:none;transition:opacity .25s}
.sheet-scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;
       border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
       transition:transform .28s cubic-bezier(.32,.72,0,1);
       padding-bottom:calc(env(safe-area-inset-bottom) + 18px);max-width:900px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;background:var(--line);border-radius:4px;margin:9px auto 4px}
.sheet-head{display:flex;align-items:center;gap:12px;padding:8px 18px 12px;
            border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sheet-head h3{font-family:'Anton';font-size:20px;text-transform:uppercase;flex:1}
.x{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.x svg{width:17px;height:17px}
.sheet-body{padding:18px}
.scoreblock{border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#faf9f7;
         border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px}
.sb-head b{font-family:'Anton';font-size:26px;color:var(--red);line-height:1}
.sb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.sb-row:first-of-type{border-top:none}
.sb-row label{flex:1;margin:0;font-size:13.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text)}
.sb-pts{color:var(--muted);font-weight:500;font-size:12px}
.sb-in{width:88px;flex:none;text-align:center;font-weight:700}
.pool-h{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
        padding:12px 14px 6px;background:#faf9f7;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--line);
     width:100%;text-align:left}
.row:first-child{border-top:none}
.row b{font-weight:700;font-size:14.5px}
.row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- tables (verbatim from app.html lines 154-196) ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
   font-weight:800;padding:10px 6px;text-align:center;background:#faf9f7}
th:nth-child(2){text-align:left}
td{padding:11px 6px;text-align:center;border-top:1px solid var(--line)}
td:nth-child(2){text-align:left;font-weight:600}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.pts{font-family:'Anton';font-size:16px}
.legend{padding:10px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);line-height:1.6}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll table{min-width:460px}
.tscroll::-webkit-scrollbar{height:5px}
.tscroll::-webkit-scrollbar-thumb{background:#d6d2cb;border-radius:4px}
/* The table is wider than a phone, and scrolling out to Pts used to take the
   team name off screen with it. Pin the position and team columns. */
.tscroll th:nth-child(1),.tscroll td:nth-child(1){position:sticky;left:0;z-index:2;
  width:30px;min-width:30px}
.tscroll th:nth-child(2),.tscroll td:nth-child(2){position:sticky;left:30px;z-index:2;
  min-width:96px;box-shadow:7px 0 7px -7px rgba(12,12,14,.22)}
.tscroll td:nth-child(1),.tscroll td:nth-child(2){background:#fff}
.tscroll th:nth-child(1),.tscroll th:nth-child(2){background:#faf9f7}
/* On a narrow phone, drop points-for and points-against. The difference and
   the total are what anyone actually reads, and losing the two makes the
   whole table fit without scrolling at all. */
@media(max-width:430px){
  .tscroll table{min-width:0}
  .tscroll th:nth-child(7),.tscroll td:nth-child(7),
  .tscroll th:nth-child(8),.tscroll td:nth-child(8){display:none}
  .tscroll th,.tscroll td{padding-left:4px;padding-right:4px}
}

/* ---------- Draw tab: tap-to-select team chips (Task 2), pool/slot cards ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;background:#faf9f7;border:1.5px solid var(--line);
      border-radius:100px;padding:8px 8px 8px 14px;font-size:13px;font-weight:700;margin:3px}
.chip.picked{background:var(--green);border-color:var(--green-deep);color:#fff}
.chip button{color:var(--muted);font-size:13px;padding:2px 4px}
.chip.picked button{color:#fff}
.dropzone{min-height:44px;padding:10px;background:#faf9f7;border:1.5px dashed var(--line);
          border-radius:10px;display:flex;flex-wrap:wrap;align-items:flex-start;text-align:left}
.slotbox{flex:1;min-width:0;text-align:center;background:#faf9f7;border:1.5px dashed var(--line);
         border-radius:8px;padding:8px 6px;font-size:12.5px;font-weight:700;overflow-wrap:break-word}
.slotbox.empty{color:var(--muted);font-weight:600}
/* MODERATE 7 fix: only .chip.picked existed before — tapping a team INSIDE a
   match slot or knockout box (as opposed to a pool's team chip) had no visual
   feedback at all, so the manager couldn't tell they'd armed a pick. */
.slotbox.picked{background:var(--green);border-color:var(--green-deep);color:#fff;border-style:solid}
.slotrow{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
/* MAJOR 2 fix: at phone width the fixed-width time input, pitch select and
   remove button used to squeeze the two flexible .slotbox elements down to
   ~24px, and overflow-wrap:break-word then rendered team names one character
   per line, 200px+ tall. Reorder (via flexbox `order`, which doesn't need the
   underlying markup to be contiguous) into two lines: the small controls
   first, "home v away" on its own line below with a sane minimum width so
   team names wrap at word boundaries instead of mid-word. Same
   phone-breakpoint convention as the .tscroll block above. */
@media(max-width:560px){
  .slotrow .slotlabel{flex:1 1 100%;width:auto;order:0}
  .slotrow .slottime{order:1}
  .slotrow .slotpitch{order:2}
  .slotrow .slotdel{order:3}
  .slotrow .slotbox{flex:1 1 40%;min-width:120px}
  .slotrow .slotbox:first-of-type{order:4}
  .slotrow .slotsep{order:5}
  .slotrow .slotbox:last-of-type{order:6}
}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
      padding:4px 10px;border-radius:100px}
.pill-live{background:var(--good-bg);color:var(--green-deep)}
.pill-off{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="managerRoot"></div>
<div class="toast" id="toast"></div>
<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div class="sheet-head"><h3 id="sheetTitle">—</h3>
    <button class="x" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script type="module">
"use strict";
const api = await import('/scores-data.js');
await api.loadVenue();
// Live scoring rules decide which inputs the score form offers — mirrors
// app.html's own boot (app.html:1125-1126). Without this a manager sees the
// hardcoded default rules from scores-data.js instead of any organiser
// customization, and can submit a score the server (which uses live rules)
// silently disagrees with.
if (api.loadScoringRules) { try { await api.loadScoringRules(); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
function openSheet(title, html){
  $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html;
  $('sheet').classList.add('on'); $('scrim').classList.add('on');
}
function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
$('sheetClose').onclick = closeSheet; $('scrim').onclick = closeSheet;

const S = {
  session: null, ageGroups: [], view: 'today', fixtures: null, standings: null,
  // Draw tab (Tasks 1-7)
  draw: undefined, drawLoadedFor: null, drawBusy: false, drawMsg: '',
  drawDirty: false, // MODERATE 4: set by every Draw-tab mutator, cleared by loadDraw()
  picked: null, // { team, from: {kind:'pool',poolId} | {kind:'slot',slotId,side} | {kind:'knockout',slotId,side} }
  importOpen: false, importMode: 'add', importRows: null, importNote: '',
  clash: null, clashBusy: false,
  // Registrations tab (Task 8)
  regs: undefined, regBusy: false, regSearch: '',
  // Spirit of Rugby Award tally (Task 9), fetched lazily in load() when supported
  spiritAward: null,
};

function renderLogin(){
  $('managerRoot').innerHTML = `<div class="mgr-login"><div class="mgr-login-card">
    <a href="Quins JRT.dc.html" class="muted" style="display:inline-block;font-size:12px;font-weight:700;text-decoration:underline;margin-bottom:16px">&larr; Main site</a>
    <div class="mgr-login-k">Manager sign in</div>
    <div class="mgr-login-h">ADH JRT</div>
    <div id="loginErr"></div>
    <div class="field"><label>Username</label><input id="lu" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <button class="btn btn-p" id="lgo">Sign in</button>
    <p class="muted" style="margin-top:16px;font-size:13px;line-height:1.6">
      Use the account you created with your age group invite code. An organiser
      account also works here.</p>
  </div></div>`;
  $('lgo').onclick = async () => {
    const u = $('lu').value.trim(), p = $('lp').value;
    if (!u || !p) { $('loginErr').innerHTML = '<div class="err">Enter your username and password.</div>'; return; }
    $('lgo').textContent = 'Signing in…';
    const r = await api.login(u, p);
    if (r.ok) {
      S.session = api.currentSession();
      const landed = await boot();
      // boot() can decide the session isn't usable here (age group not set
      // up) and show its own explanatory toast + renderLogin() instead of
      // the dashboard. Only overwrite the screen with "Signed in" when
      // boot() actually landed on the dashboard — otherwise this toast
      // stomps boot()'s explanation a moment after it appears, leaving the
      // manager on a blank login screen with no visible reason why.
      if (landed) toast('Signed in');
    } else {
      $('loginErr').innerHTML = `<div class="err">${esc(r.error || 'Wrong username or password.')}</div>`;
      $('lgo').textContent = 'Sign in';
    }
  };
}

// Returns true when boot() actually rendered the dashboard, false when it
// rendered the login screen instead (no session, or an unusable one). The
// login click handler uses this to decide whether "Signed in" is still an
// honest thing to say.
async function boot(){
  S.session = api.currentSession();
  if (!S.session) { renderLogin(); return false; }
  S.ageGroups = await api.getAgeGroups();
  const agId = api.isOrganiserSession(S.session) ? null : S.session.ageGroupId;
  if (agId && !S.ageGroups.some(a => a.id === agId)) {
    // A signed-in session whose age group no longer exists in the live
    // config (e.g. an old test account) — sign out rather than show a
    // dashboard for a group that isn't there. Mirrors app.html's own
    // fallback-to-first-age-group behaviour, but a manager dashboard has no
    // "browse a different group" affordance to fall back into, so signing
    // out is the honest outcome instead of silently picking a random one.
    api.logout(); S.session = null; renderLogin();
    toast('Your account’s age group is not set up yet — contact an organiser.');
    return false;
  }
  renderDashboard(agId); // agId is null for an organiser/admin session; Task 4 handles that
  return true;
}

const MGR_TABS = [
  { id:'today', label:'Today' },
  { id:'fixtures', label:'Fixtures & scoring' },
  { id:'results', label:'Results' },
  { id:'tables', label:'Tables' },
  { id:'draw', label:'Draw' },
  { id:'registrations', label:'Registrations' },
];

function renderDashboard(agId){
  // An organiser/admin session (agId null here) has no age group of its
  // own, so it has to land on *some* group. S.ageGroups[0] is whatever
  // happens to sort first in the live config — which can be a festival
  // group like u6 (hasStandings:false), and a manager dashboard has no
  // age-group switcher to escape it with. Mirror app.html's own fallback
  // (app.html ~1138-1139): prefer the first competitive group, and only
  // fall back to index 0 if there isn't one.
  S.ageId = agId || (S.session.ageGroupId === '*'
    ? ((S.ageGroups.find(a => a.hasStandings) || S.ageGroups[0] || {}).id)
    : S.session.ageGroupId);
  $('managerRoot').innerHTML = `<div class="mgr-shell">
    <div class="mgr-topbar"><a href="Quins JRT.dc.html">&larr; Main site</a></div>
    <nav class="mgr-tabs" id="mgrTabs"></nav>
    <main class="mgr-main" id="mgrMain"></main>
  </div>`;
  buildTabs();
  load(S.ageId);
}

function buildTabs(){
  $('mgrTabs').innerHTML = `<div class="mgr-tab-list">${MGR_TABS.map(t =>
    `<button data-go="${t.id}" class="${S.view===t.id?'on':''}">${esc(t.label)}</button>`).join('')}</div>
    <button class="mgr-signout" id="mgrSignout">Sign out</button>`;
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $('mgrSignout').onclick = signOut;
}

// MAJOR 3 / MODERATE 7 / MINOR 8 fix: S.picked, S.clash, S.drawMsg and
// S.importRows used to be cleared only piecemeal (or not at all), so a
// picked-up team, a stale clash result or a stale "Saved as a draft" banner
// could outlive the thing it referred to — across pool/team deletes and
// renames, tab switches, re-fetches and sign-outs.
//
// Split in two rather than one flat helper: clearDrawPicks() is safe to call
// from loadDraw() itself, but loadDraw() is also the last step of
// saveDraw()/doPublish()/doUnpublish()/resetDraw() — called synchronously
// right after each of those sets S.drawMsg to the success text the manager
// is meant to read. If loadDraw() cleared drawMsg too, that message would be
// overwritten before the browser ever got a chance to paint it (there's no
// await between the render() that sets it and the loadDraw() call that
// follows), so a save would silently stop telling the manager it worked.
// clearDrawTransientState() layers drawMsg on top, for the places that are
// NOT immediately followed by a legitimate "here's what just happened"
// message: load() (a score save/clear elsewhere), go() (leaving the Draw
// tab) and signOut().
function clearDrawPicks(){
  S.picked = null;
  S.clash = null;
  S.importRows = null;
  S.importOpen = false;
  S.importMode = 'add';
}
function clearDrawTransientState(){
  clearDrawPicks();
  S.drawMsg = '';
}
function signOut(){
  api.logout();
  S.session = null;
  S.view = 'today'; S.fixtures = null; S.standings = null;
  clearDrawTransientState();
  renderLogin();
  toast('Signed out');
}
function go(v){
  if (S.view === 'draw' && v !== 'draw') clearDrawTransientState(); // reduce stale Draw-tab state
  S.view = v; buildTabs(); render(); window.scrollTo(0,0);
  if (v === 'draw' && S.drawLoadedFor !== S.ageId && !S.drawDirty) loadDraw(S.ageId);
  if (v === 'registrations' && S.regs === undefined) loadRegistrations(); // Task 8 defines loadRegistrations
}

async function load(agId){
  S.ageId = agId; S.fixtures = null; S.standings = null;
  // MODERATE 4 fix: load() runs after every score save/clear. It used to
  // unconditionally throw away S.draw, silently destroying an in-progress,
  // unsaved Draw-tab edit the manager hadn't saved yet. Preserve it when
  // S.drawDirty is set; it's still safe against a real age-group switch
  // because there is no age-group switcher in this dashboard for it to race.
  if (!S.drawDirty) { S.draw = undefined; S.drawLoadedFor = null; } // invalidate: Task 1
  S.regs = undefined; // invalidate: Task 8
  S.spiritAward = null; // invalidate: Task 9
  clearDrawTransientState(); // MAJOR 3 / MODERATE 7 / MINOR 8 — but never touches S.draw or S.drawDirty
  render();
  const [fx, st] = await Promise.all([api.getFixtures(agId), api.getStandings(agId)]);
  if (S.ageId !== agId) return;
  S.fixtures = fx; S.standings = st;
  render();
  if (S.view === 'draw' && !S.drawDirty) loadDraw(agId);
  if (S.view === 'registrations') loadRegistrations();
  if (api.supportsSpiritAward(agId)) {
    S.spiritAward = await api.getSpiritAward(agId);
    if (S.ageId === agId) render();
  }
}

async function loadDraw(agId){
  S.draw = null; // loading state
  S.drawDirty = false; // a fresh fetch is by definition the clean, saved baseline
  clearDrawPicks(); // MAJOR 3 / MODERATE 7 — deliberately NOT clearDrawTransientState(): see its comment
  render();
  const draw = await api.getDraw(agId, S.session);
  if (S.ageId !== agId) return; // stale response guard, same pattern as load()
  S.draw = draw;
  S.drawLoadedFor = agId;
  render();
}

function render(){
  $('mgrMain').innerHTML = S.view === 'today' ? viewToday()
    : S.view === 'fixtures' ? viewFixtures()
    : S.view === 'results' ? viewResults()
    : S.view === 'tables' ? viewTables()
    : S.view === 'draw' ? viewDraw()
    : viewRegistrations(); // Task 8 defines viewRegistrations
  wire();
}
function wire(){
  document.querySelectorAll('[data-match]').forEach(b => b.onclick = () => openMatch(b.dataset.match));
  wireDraw();
  wireRegistrations();
}
function wireRegistrations(){
  const regSearchInput = document.getElementById('regSearchInput');
  if (regSearchInput) regSearchInput.oninput = () => { S.regSearch = regSearchInput.value; refreshRegistrationSearch(); };
}

// ---------------- Tap-to-select / tap-to-place (Task 2) ----------------
// Manager.html is phone-primary, and HTML5 drag-and-drop is unreliable on
// touch devices — the reference editor (Scores & Standings.dc.html) uses
// draggable chips + ondragover/ondrop, which this deliberately does NOT
// port. Tapping a chip selects it (S.picked); tapping a destination moves
// it there and clears S.picked; tapping the SAME chip again deselects.
function pickTeam(team, from){
  if (S.picked && S.picked.team === team && sameSource(S.picked.from, from)) {
    S.picked = null;
  } else {
    S.picked = { team, from };
  }
  render();
}
function sameSource(a, b){
  if (!a || !b || a.kind !== b.kind) return false;
  if (a.kind === 'pool') return a.poolId === b.poolId;
  return a.slotId === b.slotId && a.side === b.side;
}
// Removes `team` from wherever S.picked.from says it currently is.
function removeFromSource(from, team){
  const d = S.draw;
  if (from.kind === 'pool') {
    const p = d.pools.find((x) => x.id === from.poolId);
    if (p) p.teams = p.teams.filter((t) => t !== team);
  } else if (from.kind === 'slot') {
    const sl = d.slots.find((x) => x.id === from.slotId);
    if (sl) sl[from.side] = '';
  } else if (from.kind === 'knockout') {
    const sl = d.knockout.find((x) => x.id === from.slotId);
    if (sl) sl[from.side] = '';
  }
}
function placeTeam(dest){
  if (!S.picked || !S.draw) return;
  const { team, from } = S.picked;
  removeFromSource(from, team);
  if (dest.kind === 'pool') {
    const p = S.draw.pools.find((x) => x.id === dest.poolId);
    if (p && !p.teams.includes(team)) p.teams.push(team);
  } else if (dest.kind === 'slot') {
    const sl = S.draw.slots.find((x) => x.id === dest.slotId);
    if (sl) sl[dest.side] = team;
  } else if (dest.kind === 'knockout') {
    const sl = S.draw.knockout.find((x) => x.id === dest.slotId);
    if (sl) sl[dest.side] = team;
  }
  S.picked = null;
  S.drawDirty = true; // MODERATE 4
  render();
}

// ---------------- Pool / team CRUD (local draft only — Save is Task 3) ----------------
function addPool(){
  const existingIds = S.draw.pools.map((p) => p.id);
  let nextChar = 'A';
  for (let i = 0; i < 26; i++) { const c = String.fromCharCode(65 + i); if (!existingIds.includes(c)) { nextChar = c; break; } }
  S.draw.pools.push({ id: nextChar, name: `Pool ${nextChar}`, teams: [] });
  S.drawDirty = true; // MODERATE 4
  render();
}
function renamePool(poolId){
  const p = S.draw.pools.find((x) => x.id === poolId); if (!p) return;
  const next = prompt('Rename pool', p.name);
  if (next == null || !next.trim() || next.trim() === p.name) return;
  p.name = next.trim();
  S.drawDirty = true; // MODERATE 4
  render();
}
function removePool(poolId){
  if (!confirm('Delete this pool? This removes all its teams and match slots.')) return;
  // MAJOR 3 fix: a team picked up from this pool (or from one of its match
  // slots) must not survive the pool's deletion — otherwise it can be
  // silently placed back into a different pool a moment later.
  const removedPool = S.draw.pools.find((p) => p.id === poolId);
  const removedTeams = new Set((removedPool && removedPool.teams) || []);
  S.draw.pools = S.draw.pools.filter((p) => p.id !== poolId);
  S.draw.slots = S.draw.slots.filter((sl) => sl.poolId !== poolId);
  if (S.picked && removedTeams.has(S.picked.team)) S.picked = null;
  S.drawDirty = true; // MODERATE 4
  render();
}
function addTeam(poolId){
  const val = ($(`newteam-${poolId}`) || {}).value;
  const name = (val || '').trim();
  if (!name) return;
  const p = S.draw.pools.find((x) => x.id === poolId); if (!p) return;
  if (!p.teams.includes(name)) p.teams.push(name);
  S.drawDirty = true; // MODERATE 4
  render();
}
function renameTeam(poolId, oldName){
  const next = prompt('Rename team', oldName);
  if (next == null) return;
  const trimmed = next.trim();
  if (!trimmed || trimmed === oldName) return;
  const p = S.draw.pools.find((x) => x.id === poolId); if (!p) return;
  p.teams = p.teams.map((t) => (t === oldName ? trimmed : t));
  S.draw.slots = S.draw.slots.map((sl) => ({
    ...sl,
    home: sl.home === oldName ? trimmed : sl.home,
    away: sl.away === oldName ? trimmed : sl.away,
  }));
  // MAJOR 3 fix: S.picked.team held the OLD name, so placing it afterwards
  // would resurrect the pre-rename name alongside the renamed team.
  if (S.picked && S.picked.team === oldName) S.picked = null;
  S.drawDirty = true; // MODERATE 4
  render();
}
function removeTeam(poolId, team){
  if (!confirm(`Remove ${team} from this pool? Any match slots featuring them will show "Drop team here" until reassigned.`)) return;
  const p = S.draw.pools.find((x) => x.id === poolId); if (!p) return;
  p.teams = p.teams.filter((t) => t !== team);
  S.draw.slots = S.draw.slots.map((sl) => ({
    ...sl,
    home: sl.home === team ? '' : sl.home,
    away: sl.away === team ? '' : sl.away,
  }));
  // MAJOR 3 fix: the removed team must not still be "in hand" to be placed
  // straight back in somewhere else.
  if (S.picked && S.picked.team === team) S.picked = null;
  S.drawDirty = true; // MODERATE 4
  render();
}

// ---------------- Match slot editor (Task 3) ----------------
function addSlot(poolId){
  const step = api.slotLengthMins();
  const poolSlots = S.draw.slots.filter((sl) => sl.poolId === poolId);
  const lastMins = poolSlots.length ? Math.max(...poolSlots.map((sl) => sl.startMins)) : api.dayStartMins() - step;
  const pitch = poolPitchOf(poolId) || 'TBD';
  S.draw.slots.push({ id: `${S.ageId}:${poolId}:new${Date.now()}`, poolId, home: '', away: '', startMins: lastMins + step, pitch });
  S.drawDirty = true; // MODERATE 4
  render();
}
function removeSlot(slotId){
  S.draw.slots = S.draw.slots.filter((sl) => sl.id !== slotId);
  S.drawDirty = true; // MODERATE 4
  render();
}
function regeneratePool(poolId){
  if (!confirm("Regenerate this pool's match schedule from its current team list? This replaces all of this pool's match slots, and any scores already entered for them.")) return;
  const pool = S.draw.pools.find((p) => p.id === poolId);
  const keepPitch = poolPitchOf(poolId);
  const fresh = api.regeneratePoolSlots(S.ageId, poolId, pool.teams).map((sl) => (keepPitch ? { ...sl, pitch: keepPitch } : sl));
  S.draw.slots = [...S.draw.slots.filter((sl) => sl.poolId !== poolId), ...fresh];
  S.drawDirty = true; // MODERATE 4
  render();
}
function onSlotTimeChange(slotId, hhmm){
  const mins = api.timeToMinutes(hhmm);
  if (mins == null || isNaN(mins)) return; // reject garbage input, keep the existing time
  const sl = S.draw.slots.find((x) => x.id === slotId);
  if (sl) sl.startMins = mins;
  S.drawDirty = true; // MODERATE 4
  render();
}
function onSlotPitchChange(slotId, val){
  const sl = S.draw.slots.find((x) => x.id === slotId);
  if (sl) sl.pitch = val;
  S.drawDirty = true; // MODERATE 4
  render();
}

// ---------------- Knockout builder (Task 5) ----------------
// Ported from Scores & Standings.dc.html's onAddKnockoutSlot/
// onRemoveKnockoutSlot/onRenameKnockoutRound/onKnockoutTimeChange/
// onKnockoutPitchChange/onRegenerateKnockout/onGenerateFinals/onClearKnockout
// (lines ~1630-1704). Manager.html's tap-assign mechanism (pickTeam/
// placeTeam, Task 2) replaces the reference's draggable chips — nothing
// else about the knockout data model changes. Ported knockout mutation
// clears local draft state only; results are cleared separately via the
// existing "Clear result" button on the Fixtures & scoring tab's score
// sheet, so unlike the reference these functions do not call
// api.clearResult themselves.
function addKnockoutSlot(){
  const list = S.draw.knockout || [];
  const lastMins = list.length ? Math.max(...list.map((sl) => sl.startMins)) : 8*60;
  S.draw.knockout = [...list, { id: `${S.ageId}:knockout:new${Date.now()}`, round: 'New knockout match', home: '', away: '', startMins: lastMins + 20, pitch: 'TBD' }];
  S.drawDirty = true; // MODERATE 4
  render();
}
function removeKnockoutSlot(slotId){
  S.draw.knockout = (S.draw.knockout||[]).filter((sl) => sl.id !== slotId);
  S.drawDirty = true; // MODERATE 4
  render();
}
function renameKnockoutRound(slotId){
  const sl = S.draw.knockout.find((x) => x.id === slotId); if (!sl) return;
  const next = prompt('Rename this knockout match label', sl.round);
  if (next == null || !next.trim() || next.trim() === sl.round) return;
  sl.round = next.trim();
  S.drawDirty = true; // MODERATE 4
  render();
}
function onKnockoutTimeChange(slotId, hhmm){
  const mins = api.timeToMinutes(hhmm);
  if (mins == null || isNaN(mins)) return;
  const sl = S.draw.knockout.find((x) => x.id === slotId);
  if (sl) sl.startMins = mins;
  S.drawDirty = true; // MODERATE 4
  render();
}
function onKnockoutPitchChange(slotId, val){
  const sl = S.draw.knockout.find((x) => x.id === slotId);
  if (sl) sl.pitch = val;
  S.drawDirty = true; // MODERATE 4
  render();
}
async function regenerateKnockout(){
  if (!confirm('Replace the knockout stage with the current auto-seeded bracket from live standings? This discards any manual knockout edits.')) return;
  const fresh = await api.autoKnockoutSlots(S.ageId, S.session);
  S.draw.knockout = fresh;
  S.drawDirty = true; // MODERATE 4
  render();
}
async function generateFinals(){
  if (!confirm('Fill the finals from the current knockout results? This updates only the final matches (Cup, Bowl, Plate, Shield or Final) from the winners so far.')) return;
  const fresh = await api.autoKnockoutSlots(S.ageId, S.session);
  const isFinal = (id) => /:(CUP|BOWL|PLATE|SHIELD|FINAL)$/i.test(id||'');
  const cur = S.draw.knockout || [];
  const freshFinals = fresh.filter((f) => isFinal(f.id));
  const byId = {}; freshFinals.forEach((f) => { byId[f.id] = f; });
  const haveIds = new Set(cur.map((sl) => sl.id));
  const updated = cur.map((sl) => (isFinal(sl.id) && byId[sl.id]) ? { ...sl, home: byId[sl.id].home, away: byId[sl.id].away } : sl);
  freshFinals.forEach((f) => { if (!haveIds.has(f.id)) updated.push(f); });
  S.draw.knockout = updated;
  S.drawDirty = true; // MODERATE 4
  render();
}
function clearKnockout(){
  if (!confirm('Clear all knockout matches for this age group? You can generate them again from the standings afterwards. (Remember to Save changes.)')) return;
  S.draw.knockout = [];
  S.drawDirty = true; // MODERATE 4
  render();
}

async function saveDraw(){
  S.drawBusy = true; S.drawMsg = ''; render();
  const res = await api.saveDraw(S.ageId, S.draw, S.session);
  S.drawBusy = false;
  S.drawMsg = res.ok ? 'Saved as a draft. Use Publish to make it public.' : (res.error || 'Could not save.');
  render();
  if (res.ok) await loadDraw(S.ageId); // loadDraw() clears S.drawDirty — this IS the clean baseline now
}
async function discardDraw(){
  if (!confirm('Discard unsaved changes to this draw? This reloads the last saved version.')) return;
  await loadDraw(S.ageId);
}
async function resetDraw(){
  if (!confirm('Regenerate match times and the knockout bracket from the current teams and pools? Your teams and pool assignments are kept — only match pairings, times, and the bracket are rebuilt.')) return;
  S.drawBusy = true; render();
  const freshSlots = S.draw.pools.flatMap((p) => api.regeneratePoolSlots(S.ageId, p.id, p.teams));
  const freshKnockout = await api.autoKnockoutSlots(S.ageId, S.session);
  S.draw = { ...S.draw, slots: freshSlots, knockout: freshKnockout };
  S.drawDirty = true; // MODERATE 4 — stays true unless the save below succeeds
  const res = await api.saveDraw(S.ageId, S.draw, S.session);
  S.drawBusy = false;
  S.drawMsg = res.ok ? 'Match times and bracket regenerated — your teams were kept.' : (res.error || 'Could not save.');
  render();
  if (res.ok) await loadDraw(S.ageId);
}

// MODERATE 6 fix: factored out of checkWeekend() so doPublish() can run the
// same fetch-and-compute before publishing, without necessarily rendering
// the whole-weekend panel. Mirrors the reference's runWeekendCheck()
// (Scores & Standings.dc.html:2170-2175) one-for-one.
async function runWeekendCheck(){
  const { drawsByAge, ageNames, failed } = await api.loadAllDraws(S.session);
  return { ...api.weekendClashes(drawsByAge, ageNames), failed, groupCount: Object.keys(drawsByAge).length };
}
async function doPublish(){
  // MODERATE 6 fix: check for clashes BEFORE the confirm, and fold any that
  // involve this age group into the confirm text as a WARNING — never a
  // hard block. Mirrors the reference's onPublishDraw reasoning
  // (Scores & Standings.dc.html:2187-2202): on the morning of the
  // tournament, the person who needs to move a game must not be locked out
  // by a validator.
  S.drawBusy = true; S.drawMsg = 'Checking the weekend for pitch clashes…'; render();
  let warning = '';
  try {
    const check = await runWeekendCheck();
    const mine = (check.clashes || []).filter((c) => c.a.agId === S.ageId || c.b.agId === S.ageId);
    if (mine.length) {
      warning = `${mine.length} pitch clash${mine.length === 1 ? '' : 'es'} involving ${ageName(S.ageId)}:\n\n`
        + mine.map((c) => '• ' + api.describeClash(c)).join('\n') + '\n\n';
    }
  } catch (err) {
    warning = 'Could not check the rest of the weekend for pitch clashes just now.\n\n';
  }
  S.drawBusy = false; S.drawMsg = ''; render();
  const ask = warning + 'Publish these fixtures for ' + ageName(S.ageId) + '? Parents and coaches will see them on the public fixtures and standings pages straight away.';
  if (!confirm(ask)) return;
  S.drawBusy = true; S.drawMsg = ''; render();
  const res = await api.publishDraw(S.ageId, S.session);
  S.drawBusy = false;
  S.drawMsg = res.ok ? 'Published — these fixtures are now public.' : (res.error || 'Could not publish.');
  render();
  if (res.ok) await loadDraw(S.ageId);
}
async function doUnpublish(){
  if (!confirm('Take these fixtures back down? Anyone who has already seen them will find the fixtures replaced by "coming soon" until you publish again. Your draft is kept.')) return;
  S.drawBusy = true; S.drawMsg = ''; render();
  const res = await api.unpublishDraw(S.ageId, S.session);
  S.drawBusy = false;
  S.drawMsg = res.ok ? 'Unpublished — the public now sees "coming soon".' : (res.error || 'Could not unpublish.');
  render();
  if (res.ok) await loadDraw(S.ageId);
}

// Groups unplaced (still-TBD) bookings by age group for the clash panel —
// per age group rather than one line per pool, mirroring the reference
// (Scores & Standings.dc.html:3383-3391): fifteen groups with nothing
// scheduled would otherwise be forty lines of noise.
function clashUnplacedSummary(list){
  const by = new Map();
  (list || []).forEach((bk) => {
    if (!by.has(bk.agName)) by.set(bk.agName, []);
    by.get(bk.agName).push(bk.label);
  });
  return [...by.entries()].map(([name, labels]) => `${name}: ${labels.join(', ')}`).join(' · ');
}

async function checkWeekend(){
  S.clashBusy = true; S.clash = null; render();
  try {
    S.clash = await runWeekendCheck();
  } catch (err) {
    S.clash = { error: 'Could not read every age group. Try again.' };
  }
  S.clashBusy = false;
  render();
}

// ---------------- Registrations tab (Task 8) ----------------
// loadRegistrations() below was added ahead of schedule by Task 4 (the
// import panel needs the same cache) — kept as-is; this task adds the
// render + cross-reference logic that actually uses it as a full tab.
async function loadRegistrations(){
  S.regs = null; render();
  const data = await api.getMyRegistrations(S.session);
  S.regs = data;
  render();
}
// The server (get-my-registrations.js) already scopes an ordinary manager's
// rows to their own age group. Only the organiser/'*' session sees every
// group's rows and needs narrowing down to whichever group is currently
// selected — same id->name lookup importSourceTeams() (Task 4) performs,
// since S.ageId is an id (e.g. 'u14b') but row.ageGroup is a name (e.g.
// 'U14B Contact').
function regNarrow(rows){
  if (S.session && S.session.ageGroupId === '*') {
    const meta = S.ageGroups.find((a) => a.id === S.ageId);
    const nm = ((meta && meta.name) || '').trim().toLowerCase();
    return (rows || []).filter((r) => String(r.ageGroup||'').trim().toLowerCase() === nm);
  }
  return rows || [];
}
function regKeyOf(name, dob){ return String(name||'').trim().toLowerCase().replace(/\s+/g,' ') + '|' + String(dob||'').trim(); }
function regParseRoster(team){
  let arr = [];
  try { arr = JSON.parse(team.players || '[]'); } catch (e) { arr = []; }
  if (!Array.isArray(arr)) arr = [];
  return arr.map((p) => ({ name: [p.firstName, p.lastName].filter(Boolean).join(' ').trim(), dob: p.dob || '' }));
}
// Shared by viewRegistrations() (full render) and refreshRegistrationSearch()
// (search-only partial update, MAJOR 1 fix below) so the two can never
// disagree about who matches the search text.
function regRowsHtml(){
  const teams = regNarrow(S.regs.teams);
  const players = regNarrow(S.regs.players);
  const rosterKeys = new Set();
  teams.forEach((t) => regParseRoster(t).forEach((p) => rosterKeys.add(regKeyOf(p.name, p.dob))));
  const unmatched = players.filter((p) => !rosterKeys.has(regKeyOf(p.playerName, p.dob)));
  const q = (S.regSearch || '').trim().toLowerCase();
  const hit = (hay) => !q || hay.toLowerCase().includes(q);
  const teamRows = teams.filter((t) => hit([t.club, t.teamName, t.headCoachName, t.managerName].join(' '))).map((t) => `<div class="row">
    <div><b>${esc(t.club)} &middot; ${esc(t.teamName)}</b><small>Coach: ${esc(t.headCoachName||'—')} ${esc(t.headCoachMobile||'')} &middot; Manager: ${esc(t.managerName||'—')} ${esc(t.managerMobile||'')}</small></div></div>`).join('');
  const playerRows = players.filter((p) => hit([p.playerName, p.club, p.parentName, p.dob].join(' '))).map((p) => {
    const isUnmatched = unmatched.includes(p);
    return `<div class="row" style="${isUnmatched?'box-shadow:inset 3px 0 0 var(--warn)':''}">
      <div><b>${esc(p.playerName)}</b> <span class="muted">${esc(p.dob)}</span>${isUnmatched ? ` <span style="color:var(--warn);font-weight:700">&#9888; not on a roster</span>` : ''}
        <small>${esc(p.club)} &middot; Parent: ${esc(p.parentName||'—')} ${esc(p.parentMobile||'')} &middot; Emergency: ${esc(p.emergencyContact||'—')} ${esc(p.emergencyMobile||'')}</small>
        ${p.medicalNotes ? `<small style="color:var(--warn);font-weight:700">Medical: ${esc(p.medicalNotes)}</small>` : ''}
        <small>Consent: ${esc(p.consent||'—')}</small>
      </div></div>`;
  }).join('');
  return { teams, players, unmatched, teamRows, playerRows };
}
function viewRegistrations(){
  const head = `<div class="sec-t">Registrations</div>`;
  if (S.regs === undefined || S.regs === null) return head + `<div class="card"><div class="empty">Loading&hellip;</div></div>`;
  const { teams, players, unmatched, teamRows, playerRows } = regRowsHtml();
  return head
    + `<div class="field"><input id="regSearchInput" placeholder="Search player, club, coach or parent…" value="${esc(S.regSearch||'')}"></div>`
    + (unmatched.length ? `<div class="err" style="background:var(--warn-bg);color:var(--warn)">${unmatched.length} player registration(s) don't match any team roster by name + date of birth — flagged below.</div>` : '')
    + `<div class="sec-t">Teams (${teams.length})</div><div class="card" id="regTeamsList">${teamRows || '<div class="empty">No team registrations yet.</div>'}</div>`

// ---------------- Import registered teams (Task 4) ----------------
// Ported from Scores & Standings.dc.html's importSourceTeams/
// teamNamesFromRegistrations/importHasResults/onOpenImport/buildImportRows/
// onImportMode/onImportRowPool/onConfirmImport (lines ~2425-2660). Manager.html
// uses local S.draw edits the same way Tasks 2/3 do — nothing is sent to the
// server until Task 3's saveDraw() runs.
function importHasResults(){
  const f = S.fixtures; if (!f) return false;
  return [...(f.pool||[]), ...(f.knockout||[])].some((m) => m.result && m.result.homeScore != null);
}
function importSourceTeams(){
  const meta = S.ageGroups.find((a) => a.id === S.ageId);
  const nm = ((meta && meta.name) || '').trim().toLowerCase();
  if (!nm) return [];
  return (S.regs && S.regs.teams || []).filter((r) => String(r.ageGroup||'').trim().toLowerCase() === nm);
}
function teamNamesFromRegistrations(){
  const src = importSourceTeams();
  const perClub = {};
  src.forEach((r) => { const c = String(r.club||'').trim(); perClub[c] = (perClub[c]||0)+1; });
  const out = {};
  src.forEach((r) => {
    const code = String(r.teamName||'').trim();
    const rawClub = String(r.club||'').trim();
    const club = rawClub.replace(/\b(RFC|Rugby Football Club|Rugby Club)\b/gi, '').replace(/\s+/g,' ').trim();
    if (!code || !club) return;
    const n = (code.match(/(\d+)$/) || [])[1];
    out[code] = (perClub[rawClub] > 1 && n) ? (club + ' ' + n) : club;
  });
  return out;
}
async function openImport(){
  if (S.regs === undefined) await loadRegistrations();
  buildImportRows(S.importMode || 'add');
  S.importOpen = true;
  render();
}
function buildImportRows(mode){
  const draw = S.draw;
  if (!draw) return;
  const pools = draw.pools || [];
  const poolIds = pools.map((p) => p.id);
  if (!poolIds.length) { S.importRows = []; S.importMode = mode; S.importNote = 'Add a pool first, then import.'; return; }
  const existing = new Set();
  pools.forEach((p) => (p.teams||[]).forEach((t) => existing.add(t)));
  const src = importSourceTeams();
  const load = {}; poolIds.forEach((id) => { load[id] = 0; });
  if (mode === 'add') pools.forEach((p) => { load[p.id] = (p.teams||[]).length; });
  const prefOf = (r) => { const m = String(r.preferredPool||'').match(/[A-D]/i); const id = m ? m[0].toUpperCase() : ''; return poolIds.indexOf(id) >= 0 ? id : ''; };
  const smallest = () => poolIds.slice().sort((a,b) => load[a]-load[b] || poolIds.indexOf(a)-poolIds.indexOf(b))[0];
  const rows = [];
  src.forEach((r) => {
    const code = String(r.teamName||'').trim();
    if (!code) return;
    const inDraw = existing.has(code);
    if (mode === 'add' && inDraw) { rows.push({ code, club: String(r.club||''), pref: r.preferredPool||'', poolId: '', skip: true }); return; }
    const want = prefOf(r);
    const asked = String(r.preferredPool||'').match(/[A-D]/i);
    const unavailable = !!(asked && !want);
    let poolId = want || smallest();
    let moved = false;
    if (want && load[want] - load[smallest()] >= 2) { poolId = smallest(); moved = true; }
    load[poolId] += 1;
    rows.push({ code, club: String(r.club||''), pref: r.preferredPool||'', poolId, flag: inDraw?'in':'new', moved, unavailable, skip: false });
  });
  const nameByCode = teamNamesFromRegistrations();
  rows.forEach((row) => { row.name = nameByCode[row.code] || ''; });
  S.importRows = rows; S.importMode = mode;
  const movedCount = rows.filter((r) => r.moved).length;
  const unavailCount = rows.filter((r) => r.unavailable).length;
  const notes = [];
  if (movedCount) notes.push(movedCount + ' team' + (movedCount===1?' was':'s were') + ' moved off their preferred pool to keep the pools even.');
  if (unavailCount) notes.push(unavailCount + ' team' + (unavailCount===1?'':'s') + ' asked for a pool this draw does not have, placed in the smallest pool.');
  S.importNote = notes.join(' ');
  render();
}
function setImportMode(mode){
  if (mode === 'replace' && importHasResults()) return;
  buildImportRows(mode);
}
function setImportRowPool(code, poolId){
  S.importRows = (S.importRows||[]).map((r) => (r.code === code ? { ...r, poolId, moved: false } : r));
  render();
}
function confirmImport(){
  const draw = S.draw; if (!draw) return;
  let mode = S.importMode || 'add';
  let replaceBlocked = false;
  if (mode === 'replace' && importHasResults()) {
    // Stale/tampered mode: results now exist, so refuse the wipe and fall
    // back to the safe "add missing" behaviour instead of silently
    // proceeding with a destructive replace.
    mode = 'add';
    replaceBlocked = true;
  }
  const rows = (S.importRows||[]).filter((r) => !r.skip && r.poolId);
  const claimed = new Set();
  if (mode !== 'replace') (draw.pools||[]).forEach((p) => (p.teams||[]).forEach((t) => claimed.add(t)));
  const dupCodes = []; const usableRows = [];
  rows.forEach((r) => { if (claimed.has(r.code)) { dupCodes.push(r.code); return; } claimed.add(r.code); usableRows.push(r); });
  const names = { ...(draw.teamNames||{}) };
  usableRows.forEach((r) => { if (r.name) names[r.code] = r.name; });
  const pools = (draw.pools||[]).map((p) => {
    const teams = mode === 'replace' ? [] : [...(p.teams||[])];
    usableRows.forEach((r) => { if (r.poolId === p.id && teams.indexOf(r.code) < 0) teams.push(r.code); });
    return { ...p, teams };
  });
  let slots = draw.slots || [];
  if (mode === 'replace') slots = pools.reduce((acc, p) => acc.concat(api.regeneratePoolSlots(S.ageId, p.id, p.teams||[])), []);
  S.draw = { ...draw, pools, teamNames: names, slots };
  S.importOpen = false;
  S.drawMsg = (replaceBlocked ? 'Replace was blocked because this age group now has results, so the roster was NOT wiped. Imported as "add the missing ones" instead. ' : '')
    + 'Imported ' + usableRows.length + ' team' + (usableRows.length===1?'':'s') + ' into the editor.'
    + (mode === 'replace' ? ' Pool matches rebuilt to match the new rosters.' : ' Press "Regenerate from pool" on any pool you changed to rebuild its matches.')
    + (dupCodes.length ? ' SKIPPED ' + dupCodes.length + ' duplicate team code(s) (' + dupCodes.join(', ') + ').' : '')
    + ' Nothing is saved until you press Save changes.';
  render();
}

    const pitchOpts = Array.from(new Set(['TBD', ...api.pitchesForAgeGroup(S.ageId)]));
    const slotRows = slots.map((sl) => {
      const homePicked = S.picked && S.picked.from.kind === 'slot' && S.picked.from.slotId === sl.id && S.picked.from.side === 'home';
      const awayPicked = S.picked && S.picked.from.kind === 'slot' && S.picked.from.slotId === sl.id && S.picked.from.side === 'away';
      const opts = Array.from(new Set([...pitchOpts, sl.pitch])).filter(Boolean);
      return `<div class="slotrow">
        <input type="time" class="slottime" value="${esc(api.minutesToTimeInput(sl.startMins))}" data-slot-time="${esc(sl.id)}" style="width:110px;flex:none">
        <div class="slotbox${sl.home?'':' empty'}${homePicked?' picked':''}" data-slot-box="${esc(sl.id)}" data-slot-side="home" data-slot-team="${esc(sl.home||'')}">${sl.home?esc(tName(sl.home)):'Tap to place'}</div>
        <span class="muted slotsep" style="flex:none">v</span>
        <div class="slotbox${sl.away?'':' empty'}${awayPicked?' picked':''}" data-slot-box="${esc(sl.id)}" data-slot-side="away" data-slot-team="${esc(sl.away||'')}">${sl.away?esc(tName(sl.away)):'Tap to place'}</div>
        <select class="slotpitch" data-slot-pitch="${esc(sl.id)}" style="width:84px;flex:none">${opts.map((o)=>`<option value="${esc(o)}" ${o===(sl.pitch||'TBD')?'selected':''}>${esc(o)}</option>`).join('')}</select>
        <button class="btn-o slotdel" style="width:auto;padding:8px 10px;font-size:12px;color:#a3271b" data-slot-remove="${esc(sl.id)}">&times;</button>
      </div>`;
    }).join('');
    return `<div class="sec-t">${esc(p.name)}
        <button class="btn-o" style="width:auto;display:inline;padding:4px 10px;font-size:11px;margin-left:8px" data-rename-pool-btn="${esc(p.id)}">Rename</button>
        <button class="btn-o" style="width:auto;display:inline;padding:4px 10px;font-size:11px;margin-left:6px;color:#a3271b" data-remove-pool-btn="${esc(p.id)}">Delete</button>
      </div>
      <div class="card"><div style="padding:12px 14px">
        <div class="dropzone" data-drop-pool="${esc(p.id)}">${teamChips || '<span class="muted" style="font-size:13px">No teams yet</span>'}</div>
        <div class="field" style="display:flex;gap:8px;margin-top:10px">
          <input id="newteam-${esc(p.id)}" placeholder="New team name" style="flex:1">
          <button class="btn-o" style="width:auto;padding:12px 16px" data-add-team="${esc(p.id)}">+ Add</button>
        </div>
        <div style="margin-top:14px">${slotRows}</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-o" style="width:auto;padding:10px 14px;font-size:12px" data-add-slot="${esc(p.id)}">+ Add match slot</button>
          <button class="btn-o" style="width:auto;padding:10px 14px;font-size:12px" data-regen-pool="${esc(p.id)}">Regenerate from pool</button>
        </div>
      </div></div>`;
  }).join('');
  const addPoolBtn = `<button class="btn btn-o" id="addPoolBtn" style="margin:14px 0">+ Add pool</button>`;
  const koPitchOpts = Array.from(new Set(['TBD', ...api.pitchesForAgeGroup(S.ageId)]));
  const koRows = (S.draw.knockout||[]).slice().sort((a,b)=>a.startMins-b.startMins).map((sl) => {
    const homePicked = S.picked && S.picked.from.kind === 'knockout' && S.picked.from.slotId === sl.id && S.picked.from.side === 'home';
    const awayPicked = S.picked && S.picked.from.kind === 'knockout' && S.picked.from.slotId === sl.id && S.picked.from.side === 'away';
    const opts = Array.from(new Set([...koPitchOpts, sl.pitch])).filter(Boolean);
    return `<div class="slotrow">
      <span class="muted slotlabel" style="font-size:11.5px;width:120px;flex:none;overflow-wrap:break-word">${esc(sl.round)} <button data-ko-rename="${esc(sl.id)}" aria-label="Rename">&#9998;</button></span>
      <input type="time" class="slottime" value="${esc(api.minutesToTimeInput(sl.startMins))}" data-ko-time="${esc(sl.id)}" style="width:110px;flex:none">
      <div class="slotbox${sl.home?'':' empty'}${homePicked?' picked':''}" data-ko-box="${esc(sl.id)}" data-ko-side="home" data-ko-team="${esc(sl.home||'')}">${sl.home?esc(tName(sl.home)):'Drop team here'}</div>
      <span class="muted slotsep" style="flex:none">v</span>
      <div class="slotbox${sl.away?'':' empty'}${awayPicked?' picked':''}" data-ko-box="${esc(sl.id)}" data-ko-side="away" data-ko-team="${esc(sl.away||'')}">${sl.away?esc(tName(sl.away)):'Drop team here'}</div>
      <select class="slotpitch" data-ko-pitch="${esc(sl.id)}" style="width:84px;flex:none">${opts.map((o)=>`<option value="${esc(o)}" ${o===(sl.pitch||'TBD')?'selected':''}>${esc(o)}</option>`).join('')}</select>
      <button class="btn-o slotdel" style="width:auto;padding:8px 10px;font-size:12px;color:#a3271b" data-ko-remove="${esc(sl.id)}">&times;</button>
    </div>`;
  }).join('');
  const poolsAllPlayed = !!(S.fixtures && S.fixtures.pool && S.fixtures.pool.length > 0 && S.fixtures.pool.every((fx) => fx.result && fx.result.homeScore != null));
  const koListFinals = (S.fixtures && S.fixtures.knockout) || [];
  const isFinalKo = (id) => /:(CUP|BOWL|PLATE|SHIELD|FINAL)$/i.test(id || '');
  const koSemis = koListFinals.filter((k) => !isFinalKo(k.id) && k.home && k.away);
  const koSemisAllPlayed = koSemis.length > 0 && koSemis.every((k) => k.result && k.result.homeScore != null);
  const knockoutSection = `<div class="sec-t">Knockout stage</div><div class="card" style="padding:16px">
    ${koRows || '<div class="empty" style="padding:14px 0">No knockout matches yet.</div>'}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button class="btn-o" style="width:auto;padding:9px 14px;font-size:12px" id="addKoBtn">+ Add knockout match</button>
      <button class="btn-o" style="width:auto;padding:9px 14px;font-size:12px" id="regenKoBtn" ${poolsAllPlayed?'':'disabled'}>Generate knockout from standings</button>
      <button class="btn-o" style="width:auto;padding:9px 14px;font-size:12px" id="genFinalsBtn" ${koSemisAllPlayed?'':'disabled'}>Generate finals from knockout</button>
      <button class="btn-o" style="width:auto;padding:9px 14px;font-size:12px;color:#a3271b" id="clearKoBtn">Clear knockout</button>
    </div>
    ${!poolsAllPlayed ? `<p class="muted" style="font-size:12px;margin-top:8px">Enter every pool score first — then you can generate the knockout from the final standings.</p>` : ''}
    ${(koSemis.length > 0 && !koSemisAllPlayed) ? `<p class="muted" style="font-size:12px;margin-top:6px">Play the knockout matches first — then this fills the finals from the winners.</p>` : ''}
  </div>`;
  const saveBar = `<div class="card" style="padding:16px;margin-top:16px">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-g" id="drawSaveBtn" style="width:auto;padding:14px 22px" ${S.drawBusy?'disabled':''}>Save changes</button>
      <button class="btn btn-o" id="drawDiscardBtn" style="width:auto;padding:13px 20px" ${S.drawBusy?'disabled':''}>Discard changes</button>
      <button class="btn btn-o" id="drawResetBtn" style="width:auto;padding:13px 20px;color:#a3271b" ${S.drawBusy?'disabled':''}>Regenerate times &amp; bracket</button>
    </div>
    ${S.drawDirty ? `<p style="margin-top:10px;font-size:12.5px;color:var(--warn);font-weight:700">&#9998; You have unsaved changes.</p>` : ''}
    ${S.drawMsg ? `<p style="margin-top:10px;font-size:13px;color:var(--green-deep);font-weight:600">${esc(S.drawMsg)}</p>` : ''}
  </div>`;
  const pubState = (S.draw && S.draw._publish) || {};
  const canPub = api.canPublishNow(S.session, pubState);
  const publishPanel = `<div class="card" style="padding:16px;margin-top:16px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-family:Anton;font-size:16px;text-transform:uppercase">Publishing</span>
      <span class="pill ${pubState.published?'pill-live':'pill-off'}">${pubState.published?'Live':'Not published'}</span>
    </div>
    ${canPub ? `<div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-p" style="width:auto;padding:14px 22px" id="doPublishBtn">${pubState.published?'Republish':'Publish fixtures'}</button>
        ${pubState.published ? `<button class="btn btn-o" style="width:auto;padding:13px 20px;color:#a3271b" id="doUnpublishBtn">Unpublish</button>` : ''}
      </div>`
      : `<p style="font-size:13px;color:var(--warn);font-weight:600">Managers can publish on the tournament days only (7&ndash;8 November 2026). Ask a tournament organiser to publish before then.</p>`}
  </div>`;
  // MODERATE 5 fix: checkWeekend() always captured failed/unplaced/
  // offAllocation on S.clash, but nothing ever rendered them — so a partial
  // result (some age groups couldn't be read) showed as a confident
  // "No pitch clashes." Render all three, plus the same scope note the
  // reference shows (Scores & Standings.dc.html:3360-3362): a manager's
  // check can't see another manager's unsaved draft, and that has to be
  // said, not implied to be exhaustive.
  const clashScopeNote = (api.isOrganiserSession && api.isOrganiserSession(S.session))
    ? 'You are an organiser, so this reads every age group’s working draft — including changes nobody has published yet.'
    : 'This reads your own working draft against everyone else’s published fixtures. Another manager’s unsaved edits cannot be seen from here.';
  const clashPanel = `<div class="card" style="padding:16px;margin-top:16px">
    <div style="font-family:Anton;font-size:16px;text-transform:uppercase;margin-bottom:6px">Check the whole weekend</div>
    <p class="muted" style="font-size:12.5px;margin-bottom:4px">Every age group is edited on its own, so nothing normally notices when two of them are handed the same pitch at the same time. This reads all 15 and lists every overlap.</p>
    <p class="muted" style="font-size:12px;margin-bottom:10px">${esc(clashScopeNote)}</p>
    <button class="btn btn-o" style="width:auto;padding:12px 18px" id="checkWeekendBtn" ${S.clashBusy?'disabled':''}>${S.clashBusy?'Checking all 15 age groups…':'Check the whole weekend'}</button>
    ${S.clash ? (S.clash.error
      ? `<div class="err" style="margin-top:12px">${esc(S.clash.error)}</div>`
      : `<div style="margin-top:12px">
          <p style="font-weight:700;font-size:13.5px">${S.clash.clashes.length === 0
            ? `No pitch clashes. ${S.clash.placedCount} pool(s)/knockout matches placed across ${S.clash.groupCount} age groups.`
            : `${S.clash.clashes.length} pitch clash(es) across the weekend.`}</p>
          ${S.clash.clashes.map((c) => `<div class="err" style="margin-top:8px;background:#fbeae8;color:#a3271b">${esc(api.describeClash(c))}</div>`).join('')}
          ${(S.clash.failed && S.clash.failed.length) ? `<div class="err" style="margin-top:8px;background:var(--warn-bg);color:var(--warn)">Could not read: ${esc(S.clash.failed.join(', ').toUpperCase())} &mdash; those age groups are NOT included above, so this is not a complete check.</div>` : ''}
          ${(S.clash.unplaced && S.clash.unplaced.length) ? `<div class="err" style="margin-top:8px;background:var(--warn-bg);color:var(--warn)">Still on TBD, excluded from this check: ${esc(clashUnplacedSummary(S.clash.unplaced))}</div>` : ''}
          ${(S.clash.offAllocation && S.clash.offAllocation.length) ? S.clash.offAllocation.map((bk) => `<div class="err" style="margin-top:8px;background:var(--warn-bg);color:var(--warn)">${esc(bk.agName)} ${esc(bk.label)} is on ${esc(bk.pitch)}, which is not one of its pitches in the venue layout.</div>`).join('') : ''}
        </div>`) : ''}
  </div>`;
  return head + importPanel + pools + addPoolBtn + knockoutSection + saveBar + publishPanel + clashPanel;
}

/* Pure helpers over S.draw, ported from Scores & Standings.dc.html:1377-1398
   (this.state.editorDraw -> S.draw). poolPitchOf backs the match-slot editor
   (addSlot/regeneratePool/the pitch <select>'s default); poolStartOf/
   poolSlotCount are used by later Draw-tab tasks. */
function poolPitchOf(poolId, draw){
  const d = draw || S.draw;
  if (!d) return 'TBD';
  const vals = new Set((d.slots || []).filter((sl) => sl.poolId === poolId)
    .map((sl) => (sl.pitch || 'TBD')));
  if (!vals.size) return 'TBD';
  if (vals.size > 1) return '';
  return [...vals][0];
}
function poolStartOf(poolId, draw){
  const d = draw || S.draw;
  const mins = (d && d.slots || []).filter((sl) => sl.poolId === poolId).map((sl) => sl.startMins);
  return mins.length ? Math.min(...mins) : null;
}
function poolSlotCount(poolId, draw){
  const d = draw || S.draw;
  return ((d && d.slots) || []).filter((sl) => sl.poolId === poolId).length;
}

function openMatch(id){
  const m = findMatch(id); if (!m) return;
  const r = m.result;
  const head = `<div class="card" style="margin-bottom:16px">
      <div class="row"><div><b>${esc(m.home?tName(m.home):'TBD')} v ${esc(m.away?tName(m.away):'TBD')}</b>
        <small>${esc(m.poolName||m.round||'')} &middot; ${esc(m.time||'')} &middot; ${esc(m.pitch||'Pitch TBD')}</small></div></div>
      ${r ? `<div class="row"><div><b style="font-family:'Anton';font-size:26px">${r.homeScore} &ndash; ${r.awayScore}</b>
        <small>Tries ${r.homeTries||0}&ndash;${r.awayTries||0}${r.walkover?' &middot; walk-over':''}</small></div></div>` : ''}
    </div>`;

  const parts = api.scoringFor(S.ageId);
  const sideInputs = (side, label) => `
    <div class="scoreblock">
      <div class="sb-head"><span>${esc(label)}</span><b id="tot-${side}">0</b></div>
      ${parts.map(k => `
        <div class="sb-row">
          <label for="${side}-${k}">${esc(api.scoreLabel(k))} <span class="sb-pts">${api.scorePoints(k)} pts</span></label>
          <input id="${side}-${k}" class="sb-in" type="number" inputmode="numeric" min="0" step="1"
                 value="${r ? (r[side + k.charAt(0).toUpperCase() + k.slice(1)] || 0) : 0}">
        </div>`).join('')}
      <div class="sb-row">
        <label for="${side}-cards">Cards</label>
        <input id="${side}-cards" class="sb-in" type="number" inputmode="numeric" min="0" step="1"
               value="${r ? (r[side + 'Cards'] || 0) : 0}">
      </div>
    </div>`;

  const showSpirit = api.supportsSpiritAward(S.ageId);
  const spiritBlock = showSpirit ? `<div class="field" style="margin-top:4px">
    <label>Spirit of Rugby &mdash; one nomination per side</label>
    <div style="display:flex;gap:10px">
      <input id="spirit-home" placeholder="${esc(m.home?tName(m.home):'Home')} player" value="${r ? esc(r.spiritNomineeHome||'') : ''}" style="flex:1">
      <input id="spirit-away" placeholder="${esc(m.away?tName(m.away):'Away')} player" value="${r ? esc(r.spiritNomineeAway||'') : ''}" style="flex:1">
    </div>
  </div>` : '';

  openSheet('Enter score', head + `<div id="scErr"></div>
    ${sideInputs('home', m.home ? tName(m.home) : 'Home')}
    ${sideInputs('away', m.away ? tName(m.away) : 'Away')}
    <div class="field" style="margin-top:4px"><label>Walk-over</label><select id="wo">
      <option value="">No walk-over</option>
      <option value="home" ${r&&r.walkover==='home'?'selected':''}>${esc(m.home?tName(m.home):'Home')} awarded the match</option>
      <option value="away" ${r&&r.walkover==='away'?'selected':''}>${esc(m.away?tName(m.away):'Away')} awarded the match</option>
    </select><p class="muted" style="font-size:12px;margin-top:6px">A walk-over is recorded as 20&ndash;0 with 4 tries.</p></div>
    ${spiritBlock}
    <button class="btn btn-g" id="sgo">${r?'Update result':'Save result'}</button>
    ${r ? `<button class="btn btn-o" id="sclr" style="margin-top:10px;color:#c0392b">Clear result</button>
      <p class="muted" style="font-size:12px;margin-top:8px;line-height:1.5">Clearing puts the match back to unplayed. It is not the same as saving 0&ndash;0, which is a draw worth two league points each.</p>` : ''}`);

  const readSide = (side) => {
    const o = {};
    parts.forEach(k => { o[k] = Number(($(`${side}-${k}`) || {}).value || 0); });
    return o;
  };
  const recalc = () => {
    const wo = $('wo').value;
    ['home','away'].forEach(side => {
      const t = wo ? (wo === side ? 20 : 0) : api.scoreTotal(S.ageId, readSide(side));
      $('tot-' + side).textContent = t;
    });
    const off = !!$('wo').value;
    parts.forEach(k => ['home','away'].forEach(side => {
      const el = $(`${side}-${k}`); if (el) { el.disabled = off; el.style.opacity = off ? .45 : 1; }
    }));
  };
  parts.forEach(k => ['home','away'].forEach(side => {
    const el = $(`${side}-${k}`); if (el) el.oninput = recalc;
  }));
  $('wo').onchange = recalc;
  recalc();

  if (r && $('sclr')) $('sclr').onclick = async () => {
    if (!confirm('Clear this result? The match goes back to unplayed and the pool table is recalculated.')) return;
    $('sclr').textContent = 'Clearing…';
    const res = await api.clearResult(m.id, S.session);
    if (res.ok) { closeSheet(); toast('Result cleared'); await load(S.ageId); }
    else { $('scErr').innerHTML = `<div class="err">${esc(res.error||'Could not clear.')}</div>`; $('sclr').textContent = 'Clear result'; }
  };

  $('sgo').onclick = async () => {
    const wo = $('wo').value;
    if (!wo) {
      const zero = ['home','away'].every(side => parts.every(k => !Number(($(`${side}-${k}`)||{}).value || 0)));
      if (zero && !confirm('Save this as a 0–0 draw? Both teams get two league points.\n\nTo remove the result instead, use Clear result.')) {
        return;
      }
    }
    $('sgo').textContent = 'Saving…';
    const payload = { walkover: wo || null };
    ['home','away'].forEach(side => parts.forEach(k => {
      payload[side + k.charAt(0).toUpperCase() + k.slice(1)] = Number(($(`${side}-${k}`)||{}).value || 0);
    }));
    payload.homeCards = Number(($('home-cards')||{}).value || 0);
    payload.awayCards = Number(($('away-cards')||{}).value || 0);
    if (showSpirit) {
      payload.spiritNomineeHome = ($('spirit-home')||{}).value || '';
      payload.spiritNomineeAway = ($('spirit-away')||{}).value || '';
    }
    const res = await api.submitResult(m.id, payload, S.session);
    if (res.ok) {
      closeSheet();
      toast(res.stored ? `Saved ${res.stored.homeScore}–${res.stored.awayScore}` : 'Result saved');
      await load(S.ageId);
    }
    else { $('scErr').innerHTML = `<div class="err">${esc(res.error||'Could not save.')}</div>`; $('sgo').textContent='Save result'; }
  };
}

function findMatch(id){
  const fx = S.fixtures; if (!fx) return null;
  return (fx.pool || []).concat(fx.knockout || []).find(x => x.id === id) || null;
}

boot();
</script>

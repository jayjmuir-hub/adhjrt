<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADH JRT — Match Day</title>
<meta name="description" content="Fixtures, live scores and standings for the Abu Dhabi Harlequins Junior Rugby Tournament, 7-8 November 2026.">

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C0C0E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ADH JRT">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ADH JRT — Match Day app
   Same shell as the club "Club Hub" prototype (bottom tabs on
   phones, top nav on desktop, bottom sheets) but on the
   tournament palette and driven by the live JRT backend rather
   than seeded sample data.
   ============================================================ */
:root{
  /* JRT palette — Akuma kit, matching adhjrt.com */
  --red:#E11B22; --red-deep:#A81219; --green:#17A34A; --green-deep:#0F7A36;
  --ink:#0C0C0E; --paper:#F3F1ED; --card:#ffffff; --line:#e2ded4;
  --muted:#77726e; --text:#14151A;
  --good:#17A34A; --good-bg:#e8f6ec; --warn:#c9861a; --warn-bg:#fbf1dd;
  --shadow:0 6px 24px rgba(12,12,14,.10); --shadow-sm:0 2px 8px rgba(12,12,14,.08);
  --radius:16px; --radius-sm:11px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--paper);color:var(--text);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font-family:inherit;font-size:inherit}
button{border:none;background:none;cursor:pointer;color:inherit}
a{color:inherit}

/* ---------- app frame ---------- */
.app{max-width:900px;margin:0 auto;min-height:100vh;
     padding-bottom:calc(env(safe-area-inset-bottom) + 84px)}
@media(min-width:820px){ .app{padding-bottom:40px} }

header.top{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
           padding-top:env(safe-area-inset-top)}
.top-line{height:4px;background:linear-gradient(90deg,var(--red),var(--red) 45%,var(--green))}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px;text-align:left;padding:0;color:inherit}
.brand:active{opacity:.7}
.top-t,.top-s{display:block}
/* No white tile: the crest is a transparent PNG and sits straight on the bar,
   the same treatment the homepage uses since the design refresh. */
.crest{width:38px;height:38px;border-radius:9px;flex:none}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.top-t{font-family:'Anton';font-size:18px;letter-spacing:.5px;line-height:1}
.top-s{font-size:10px;letter-spacing:2px;color:#3bd070;font-weight:700;margin-top:3px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
       padding:5px 10px;border-radius:100px;white-space:nowrap}
.badge-pub{background:rgba(255,255,255,.13);color:#cdd2da}
.badge-mgr{background:var(--green);color:#fff}
.badge-org{background:var(--red);color:#fff}
.sitelink{display:flex;align-items:center;gap:5px;padding:6px 11px 6px 9px;border-radius:100px;
          border:1px solid rgba(255,255,255,.22);color:#cdd2da;font-size:11px;font-weight:700;
          letter-spacing:.6px;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.sitelink svg{width:14px;height:14px;flex:none}
.sitelink:active{background:rgba(255,255,255,.1)}
@media(max-width:400px){ .sitelink span{display:none} .sitelink{padding:7px} }

/* desktop nav */
.nav-desktop{display:none;gap:4px;padding:0 12px 10px}
.nav-desktop button{padding:9px 16px;border-radius:100px;font-weight:700;font-size:14px;color:#aeb4bf}
.nav-desktop button.on{background:rgba(255,255,255,.12);color:#fff}
@media(min-width:820px){ .nav-desktop{display:flex} .tabbar{display:none!important} }

main{padding:16px}

/* ---------- bottom tabs ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(255,255,255,.95);
        backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;
        grid-template-columns:repeat(5,1fr);padding:6px 2px calc(env(safe-area-inset-bottom) + 6px);
        max-width:900px;margin:0 auto}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 1px;
               font-size:9.5px;font-weight:700;letter-spacing:.2px;color:var(--muted);
               white-space:nowrap}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--red)}

/* ---------- building blocks ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);
      border:1px solid var(--line);overflow:hidden}
/* The site marks every section with a short green rule before the label
   (.fmt-eyebrow .rule on the homepage). Same device, scaled to a phone. */
.sec-t{font-family:'Anton';font-size:19px;text-transform:uppercase;letter-spacing:.4px;
       margin:22px 2px 10px;color:var(--ink);display:flex;align-items:center;gap:10px}
.sec-t::before{content:"";flex:none;width:26px;height:4px;border-radius:2px;background:var(--green)}
.sec-t:first-child{margin-top:4px}
.muted{color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--ink),#1d1d22);color:#fff;border-radius:var(--radius);
      padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.hero::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
              background:linear-gradient(90deg,var(--red),var(--red) 45%,var(--green))}
.hero-k{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#3bd070}
.hero-h{font-family:'Anton';font-size:30px;line-height:1.04;text-transform:uppercase;margin-top:8px}
.hero-p{color:#aeb4bf;font-size:14px;margin-top:8px;line-height:1.55}

.cd{display:flex;gap:8px;margin-top:16px}
.cd div{flex:1;background:rgba(255,255,255,.08);border-radius:11px;padding:9px 4px;text-align:center}
.cd b{display:block;font-family:'Anton';font-size:22px;line-height:1}
.cd span{font-size:9px;letter-spacing:1.2px;color:#8b93a3;font-weight:700}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
@media(min-width:560px){ .tiles{grid-template-columns:repeat(4,1fr)} }
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
      padding:13px;box-shadow:var(--shadow-sm)}
.tile b{display:block;font-family:'Anton';font-size:26px;color:var(--ink);line-height:1}
.tile span{font-size:10px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
           color:var(--muted);margin-top:5px;display:block}

.pill-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{flex:none;padding:8px 14px;border-radius:100px;font-weight:700;font-size:13px;
      border:1.5px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap}
/* Red for day one, green for day two — the same coding the homepage format
   cards use for Saturday and Sunday. */
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.pill.on.sun{background:var(--green);border-color:var(--green)}

/* match rows */
.mrow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;
      padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-child{border-top:none}
.mtime{font-weight:800;color:var(--red);font-size:13px}
.mpitch{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.mteams{font-weight:600;font-size:14.5px;line-height:1.4}
.mmeta{font-size:11px;color:var(--muted);margin-top:3px}
.mscore{font-family:'Anton';font-size:19px;color:var(--ink);white-space:nowrap}
.chev{color:#c6c2bc}

.empty{padding:34px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:'Anton';font-size:22px;color:var(--ink);
         text-transform:uppercase;margin-bottom:8px}
.cs-pill{display:inline-block;background:linear-gradient(90deg,var(--red),var(--green));color:#fff;
         font-weight:800;font-size:11px;letter-spacing:1px;padding:6px 15px;border-radius:100px;
         text-transform:uppercase;margin-bottom:14px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
   font-weight:800;padding:10px 6px;text-align:center;background:#faf9f7}
th:nth-child(2){text-align:left}
td{padding:11px 6px;text-align:center;border-top:1px solid var(--line)}
td:nth-child(2){text-align:left;font-weight:600}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.pts{font-family:'Anton';font-size:16px}
.legend{padding:10px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);line-height:1.6}
.scoreblock{border:1.5px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#faf9f7;
         border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px}
.sb-head b{font-family:'Anton';font-size:26px;color:var(--red);line-height:1}
.sb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.sb-row:first-of-type{border-top:none}
.sb-row label{flex:1;margin:0;font-size:13.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text)}
.sb-pts{color:var(--muted);font-weight:500;font-size:12px}
.sb-in{width:88px;flex:none;text-align:center;font-weight:700}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll table{min-width:460px}
.tscroll::-webkit-scrollbar{height:5px}
.tscroll::-webkit-scrollbar-thumb{background:#d6d2cb;border-radius:4px}
/* The table is wider than a phone, and scrolling out to Pts used to take the
   team name off screen with it. Pin the position and team columns. */
.tscroll th:nth-child(1),.tscroll td:nth-child(1){position:sticky;left:0;z-index:2;
  width:30px;min-width:30px}
.tscroll th:nth-child(2),.tscroll td:nth-child(2){position:sticky;left:30px;z-index:2;
  min-width:96px;box-shadow:7px 0 7px -7px rgba(12,12,14,.22)}
.tscroll td:nth-child(1),.tscroll td:nth-child(2){background:#fff}
.tscroll th:nth-child(1),.tscroll th:nth-child(2){background:#faf9f7}
/* A pinned cell needs its row tint restated or it scrolls as plain white. */
tr.me td:nth-child(1),tr.me td:nth-child(2){background:#fffdf4}
/* On a narrow phone, drop points-for and points-against. The difference and
   the total are what anyone actually reads, and losing the two makes the
   whole table fit without scrolling at all. */
@media(max-width:430px){
  .tscroll table{min-width:0}
  .tscroll th:nth-child(7),.tscroll td:nth-child(7),
  .tscroll th:nth-child(8),.tscroll td:nth-child(8){display:none}
  .tscroll th,.tscroll td{padding-left:4px;padding-right:4px}
}
/* Was nine full-width rows — on a phone, taller than the table it was there
   to explain. Now a wrapped row of small chips, and — since every match row,
   table and bracket shows the code by default — opened on demand from a
   small pill rather than sitting under every tab all the time. */
.keybtn{display:inline-flex;align-items:center;gap:5px;margin:0 0 12px;padding:6px 13px;
        border-radius:100px;font-weight:700;font-size:12px;border:1.5px solid var(--line);
        background:#fff;color:var(--muted)}
.keybtn::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--ink);flex:none}
.keygrid{display:flex;flex-wrap:wrap;gap:6px;background:#fff;padding:11px 12px}
.keyrow{display:inline-flex;align-items:center;gap:6px;background:var(--paper);
        border:1px solid var(--line);border-radius:100px;padding:3px 10px 3px 3px}
.keycode{flex:none;text-align:center;background:var(--ink);color:#fff;font-family:'Anton';
         font-size:10.5px;letter-spacing:.4px;padding:3px 6px;border-radius:5px}
.keyname{font-size:11.5px;color:var(--text);white-space:nowrap}

/* A club's crest, shown to the left of its code wherever the code appears.
   Fixed square box with object-fit:contain so a tall crest and a wide
   wordmark logo both sit at the same height; a white backing plate keeps a
   transparent-background logo legible on the app's dark cards too. Absent
   entirely (via tBadge()/tLogoImg() returning '') for a club with no logo
   on file, rather than showing a broken image. */
.tlogo{width:16px;height:16px;border-radius:4px;object-fit:contain;background:#fff;
       vertical-align:-3px;margin-right:5px;flex:none}
.tlogo-lg{width:26px;height:26px;border-radius:6px;object-fit:contain;background:#fff;
          vertical-align:-6px;margin-right:8px;flex:none}

/* forms + sheet */
.sheet-scrim{position:fixed;inset:0;background:rgba(12,12,14,.5);z-index:60;opacity:0;
             pointer-events:none;transition:opacity .25s}
.sheet-scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;
       border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
       transition:transform .28s cubic-bezier(.32,.72,0,1);
       padding-bottom:calc(env(safe-area-inset-bottom) + 18px);max-width:900px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;background:var(--line);border-radius:4px;margin:9px auto 4px}
.sheet-head{display:flex;align-items:center;gap:12px;padding:8px 18px 12px;
            border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sheet-head h3{font-family:'Anton';font-size:20px;text-transform:uppercase;flex:1}
.x{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.x svg{width:17px;height:17px}
.sheet-body{padding:18px}

label{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
      color:var(--muted);margin-bottom:6px}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
             background:#fff;color:var(--text);font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--red)}
.field{margin-bottom:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:14px;border-radius:11px;font-weight:800;font-size:15px;
     text-transform:uppercase;letter-spacing:.5px;text-align:center;display:block}
.btn-p{background:var(--red);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.err{background:#fbeae8;color:#a3271b;padding:11px 13px;border-radius:10px;font-size:13.5px;
     font-weight:600;margin-bottom:14px}
.ok{background:var(--good-bg);color:var(--green-deep);padding:11px 13px;border-radius:10px;
    font-size:13.5px;font-weight:600;margin-bottom:14px}
.note{background:var(--warn-bg);color:#8a5c10;padding:11px 13px;border-radius:10px;
      font-size:13px;font-weight:600;margin-bottom:14px;line-height:1.5}

.row{display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--line);
     width:100%;text-align:left}
.row:first-child{border-top:none}
.row b{font-weight:700;font-size:14.5px}
.row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.row .chev{margin-left:auto}

/* The toast used to slide up 120px from off-screen. It sits above the tab bar
   on z-index 80 (the bar is 45), so for the first fraction of a second of that
   travel it covered the Fixtures and Tables labels. It now fades in with a 10px
   lift, so it never crosses the bar. Anchored at the bottom, a message long
   enough to wrap grows upwards, away from the bar, not down over it. */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;
       pointer-events:none;
       bottom:calc(env(safe-area-inset-bottom) + 100px);background:var(--ink);color:#fff;
       padding:12px 20px;border-radius:100px;font-weight:600;font-size:14px;z-index:80;
       transition:transform .22s ease-out,opacity .22s ease-out;
       box-shadow:var(--shadow);max-width:88vw;text-align:center;line-height:1.35}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* No tab bar on desktop, so it can sit lower. */
@media(min-width:820px){ .toast{bottom:calc(env(safe-area-inset-bottom) + 28px)} }
.spin{padding:40px;text-align:center;color:var(--muted);font-size:14px}
/* team card + chips */
.tcard{background:var(--ink);color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.tcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--red),var(--red) 45%,var(--green))}
.tcard-k{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#3bd070}
.tcard-n{font-family:'Anton';font-size:26px;line-height:1.06;text-transform:uppercase;margin-top:7px}
.tcard-m{color:#aeb4bf;font-size:13.5px;margin-top:6px;line-height:1.5}
.tcard-cta{position:absolute;top:16px;right:16px;font-size:11px;font-weight:800;letter-spacing:.6px;
           text-transform:uppercase;color:#cdd2da;border:1px solid rgba(255,255,255,.25);
           padding:6px 12px;border-radius:100px}
.kick{display:flex;gap:8px;margin-top:14px}
.kick div{flex:1;background:rgba(255,255,255,.08);border-radius:10px;padding:9px 4px;text-align:center}
.kick b{display:block;font-family:'Anton';font-size:20px;line-height:1}
.kick span{font-size:9px;letter-spacing:1.1px;color:#8b93a3;font-weight:700}
.chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
      padding:4px 9px;border-radius:100px;margin-left:7px;vertical-align:2px}
.chip-live{background:var(--red);color:#fff}
.chip-next{background:var(--green);color:#fff}
.chip-ft{background:var(--line);color:var(--muted)}
.mine{background:#fffdf4}
.mine .mteams{font-weight:800}
.pool-h{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
        padding:12px 14px 6px;background:#faf9f7;border-top:1px solid var(--line)}
tr.me td{background:#fffdf4;font-weight:800}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;
            border:1.5px solid var(--line);background:#fff;color:var(--muted)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---- carried over from the main site ---------------------------------- */

/* Barlow Semi Condensed is the site's voice for small uppercase labels:
   eyebrows, day sub-labels, the age chips on the format cards. Anton stays
   for display type and numbers, Barlow for body copy. */
.hero-k,.tcard-k,.tcard-cta,.cd span,.kick span,.tile span,.pool-h,.chip,
.cs-pill,.pill,.btn,label,th,.daytag-d{
  font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif}
/* Semi Condensed runs narrow, so the site opens the tracking up to match. */
.hero-k,.tcard-k,.pool-h,.cs-pill,.tile span{letter-spacing:.14em}
.pill{letter-spacing:.03em}
.btn{letter-spacing:.1em}
/* Score-entry labels are sentence case, not micro-caps — leave them Barlow. */
.sb-row label{font-family:'Barlow',system-ui,sans-serif;letter-spacing:0}

/* Day tag, from the homepage format cards: a solid day marker in the day's
   colour, then the date in the eyebrow voice. */
.daytag{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.daytag-n{font-family:'Anton';font-size:12px;letter-spacing:.14em;color:#fff;
          background:var(--red);padding:5px 10px;border-radius:6px}
.daytag.sun .daytag-n{background:var(--green)}
.daytag-d{font-weight:700;text-transform:uppercase;font-size:12px;color:var(--muted)}

/* Venue map, opened full width in a sheet. */
.vmap{width:100%;height:auto;display:block;border-radius:var(--radius);border:1px solid var(--line)}

/* The site fades sections up as they arrive. Same idea on a tab change only,
   never on a data refresh — a manager entering scores should not watch the
   screen animate every time a result lands. */
@keyframes appFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.main-anim{animation:appFadeUp .22s ease-out both}
@media(prefers-reduced-motion:reduce){.main-anim{animation:none}}

::selection{background:var(--red);color:#fff}

</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-line"></div>
    <div class="top-in">
      <!-- Tapping the crest returns to Today, the app's home screen — the
           convention people already expect from a logo in an app header. -->
      <button class="brand" id="goHome" aria-label="Back to Today">
        <span class="crest"><img src="/assets/crest.png" alt=""></span>
        <span>
          <span class="top-t">ADH JRT</span>
          <span class="top-s">MATCH DAY</span>
        </span>
      </button>
      <div class="who">
        <span class="badge badge-pub" id="roleBadge">Viewing</span>
        <a class="sitelink" href="/" aria-label="Tournament website" title="Tournament website">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
          <span>Site</span>
        </a>
      </div>
    </div>
    <nav class="nav-desktop" id="navDesktop"></nav>
  </header>

  <main id="main"><div class="spin">Loading…</div></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div class="sheet-head"><h3 id="sheetTitle">—</h3>
    <button class="x" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
"use strict";

/* The app is a thin shell over the same data layer the website uses, so
   scores, standings, publishing and permissions behave identically — there is
   no second source of truth to keep in step. */
const api = await import('/scores-data.js');
/* Managers and organisers authenticate against different endpoints and store
   their sessions under different keys — see signIn(). */
const orgApi = await import('/organizer-data.js');

/* ---------------- tournament facts ----------------
   Which day an age group plays lets a fixture's kick-off minutes become a real
   date, which is what makes "kick-off in 24 minutes" possible rather than just
   showing "09:20".

   This used to be a hardcoded list here called SATURDAY, and it was WRONG — it
   had U12G on Saturday and left U18B and U18G off it entirely, so both fell
   through to Sunday. It now comes from the venue layout in the shared data
   layer, where an age group is on Saturday because Saturday is where it has
   pitches. One source of truth, and an organiser can change it in the back
   office without a deploy.

   loadVenue() is awaited at start-up (see the boot block at the bottom of this
   file). Before it resolves these readers answer from the built-in default, so
   nothing here can ever be undefined or block on a config fetch. */
await api.loadVenue();

const DAY1 = api.venue().day1.date, DAY2 = api.venue().day2.date;
const dayOf = (agId) => api.dayOfAgeGroup(agId);
const isSat = (agId) => api.isDayOne(agId);

const KICKOFF = new Date(DAY1 + 'T08:00:00+04:00');
const END     = new Date(DAY2 + 'T20:00:00+04:00');
const FOLLOW_KEY = 'adhjrt_follow_v2';   // { ageId, team }

const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18M8 3v4M16 3v4"/><rect x="3" y="5" width="18" height="16" rx="2"/></svg>',
  fixtures:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>',
  results:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M6.5 10.5h2.4M6.5 13.5h2.4M15.1 12h2.4"/></svg>',
  tables:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
};

const TABS = [
  { id:'today', label:'Today' }, { id:'fixtures', label:'Fixtures' },
  { id:'results', label:'Results' },
  { id:'tables', label:'Tables' }, { id:'more', label:'More' },
];

/* ---------------- state ---------------- */
const S = {
  view:'today', session:null, ageGroups:[],
  ageId:null, team:null,        // what you follow
  browseId:null,                // what Fixtures/Tables are showing
  fixtures:null, standings:null,// the BROWSED age group
  followFx:null,                // the FOLLOWED age group — what Today reports on
  onlyMine:true,                // Fixtures/Results filter when a team is followed
};

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600);
}

const isOrganiser = api.isOrganiserSession;

/* Someone can hold BOTH a manager and an organiser account. currentSession()
   returns the manager one first, which would quietly demote an organiser to a
   single age group. Prefer the broader role. */
function resolveSession(){
  const s = api.currentSession();
  if (isOrganiser(s)) return s;
  try {
    const raw = localStorage.getItem('adhjrt_organizer_session');
    const o = raw ? JSON.parse(raw) : null;
    if (o && o.token) return { token:o.token, username:o.username, name:o.name, ageGroupId:'*', isOrganizer:true };
  } catch(e){}
  return s;
}

const canScore = api.canScoreAgeGroup;
const ageName = (id) => (S.ageGroups.find(a => a.id === id) || {}).name || id;
/* Teams are stored as codes (ADH1). Rows and tables show the code because
   space is tight; anywhere with room shows the readable name. */
/* Codes are only unique WITHIN an age group, so teamLabel wants to know which
   one. Default to whatever is being browsed; teamLabel falls back safely when
   that is the wrong guess (it refuses to name a code two loaded draws disagree
   about, rather than naming the wrong club). */
const tName = (code, agId) =>
  (api.teamLabel ? api.teamLabel(code, agId || S.browseId) : code) || code || '';
/* The short form for the standings column and the bracket, where a full club
   name does not fit. */
const tShort = (code) => (api.teamShort ? api.teamShort(code) : code) || code || '';
/* The club's crest for a code, or '' if this club has no logo on file (an
   "Other" free-text registration, or a hand-typed full name). */
const tLogoSrc = (code) => (api.teamLogoSrc ? api.teamLogoSrc(code) : '') || '';
/* Small crest + code, safe HTML for any spot that already shows tShort().
   Falls back to just the code — no broken image — when there is no crest. */
function tBadge(code){
  const src = tLogoSrc(code);
  return (src ? `<img class="tlogo" src="${esc(src)}" alt="">` : '') + esc(tShort(code));
}
/* The larger crest used once per screen — the Following card's headline. */
function tLogoImg(code){
  const src = tLogoSrc(code);
  return src ? `<img class="tlogo-lg" src="${esc(src)}" alt="">` : '';
}

function phase(){
  const n = Date.now();
  return n < KICKOFF.getTime() ? 'before' : n <= END.getTime() ? 'during' : 'after';
}

/* A fixture's real kick-off moment, from its minutes-past-midnight and the day
   its age group plays. */
function kickoffAt(m, agId){
  if (m.startMins == null) return null;
  const h = String(Math.floor(m.startMins/60)).padStart(2,'0');
  const mi = String(m.startMins%60).padStart(2,'0');
  return new Date(`${dayOf(agId)}T${h}:${mi}:00+04:00`);
}
function untilText(dt){
  if (!dt) return '';
  const diff = dt.getTime() - Date.now();
  if (diff < -75*60*1000) return '';
  if (diff < 0) return 'Under way';
  const mins = Math.round(diff/60000);
  if (mins < 60) return `Kick-off in ${mins} min`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `Kick-off in ${hrs}h ${mins%60}m`;
  return dt.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}

/* ---------------- follow ---------------- */
function loadFollow(){
  try {
    const f = JSON.parse(localStorage.getItem(FOLLOW_KEY));
    if (f && f.ageId) { S.ageId = f.ageId; S.team = f.team || null; }
  } catch(e){}
}
function saveFollow(){
  try { localStorage.setItem(FOLLOW_KEY, JSON.stringify({ ageId:S.ageId, team:S.team })); } catch(e){}
}

/* Teams only exist once a draw is published, so this can come back empty and
   the UI has to cope rather than showing an empty chooser. */
function teamsInAge(){
  const st = S.standings;
  if (!st || st.awaitingPublication) return [];
  const out = new Set();
  (st.pools || []).forEach(p => (p.teams || []).forEach(t => out.add(t)));
  return [...out].sort();
}
/* getFixtures() returns POOL teams as readable names (it runs them through
   teamLabel) but knockout slots — and the standings tables — as codes. The
   followed team is stored as a code, so `m.home === S.team` was never true for
   a pool match: following a team quietly emptied the app. Normalise both sides
   through teamLabel, which maps a code to its name and leaves a name alone. */
const sameTeam = (a, b) => !!(a && b) && (a === b || tName(a) === tName(b));
const isMine = (m) => !!(S.team && (sameTeam(m.home, S.team) || sameTeam(m.away, S.team)));

/* ---------------- chrome ---------------- */
function paintRole(){
  const b = $('roleBadge');
  if (isOrganiser(S.session)) { b.className='badge badge-org'; b.textContent='Organiser'; }
  else if (S.session) { b.className='badge badge-mgr';
    b.textContent = S.session.ageGroupId === '*' ? 'Admin' : ageName(S.session.ageGroupId); }
  else { b.className='badge badge-pub'; b.textContent='Viewing'; }
}
function buildNav(){
  $('tabbar').innerHTML = TABS.map(t =>
    `<button data-go="${t.id}" class="${S.view===t.id?'on':''}">${ICON[t.id]}<span>${t.label}</span></button>`).join('');
  $('navDesktop').innerHTML = TABS.map(t =>
    `<button data-go="${t.id}" class="${S.view===t.id?'on':''}">${t.label}</button>`).join('');
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
}
function go(v){ S.view = v; buildNav(); render(true); window.scrollTo(0,0); }
$('goHome').onclick = () => { closeSheet(); go('today'); };

/* ---------------- sheet ---------------- */
function openSheet(title, html){
  $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html;
  $('sheet').classList.add('on'); $('scrim').classList.add('on');
}
function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
const sheetOpen = () => $('sheet').classList.contains('on');
$('sheetClose').onclick = closeSheet; $('scrim').onclick = closeSheet;

/* ---------------- data ----------------
   Two age groups are in play at once: the one you are BROWSING (S.browseId,
   set by the pills on Fixtures/Tables) and the one you FOLLOW (S.ageId, what
   the Today tab reports on). They used to share a single fixtures slot, so
   looking at another age group emptied Today until the page was reloaded.
   They are held separately now. */
async function load(agId){
  S.browseId = agId;
  S.fixtures = null; S.standings = null;
  render();
  const [fx, st] = await Promise.all([api.getFixtures(agId), api.getStandings(agId)]);
  if (S.browseId !== agId) return;          // a newer pill won the race
  S.fixtures = fx; S.standings = st;
  if (agId === S.ageId) S.followFx = fx;    // one fetch serves both tabs
  render();
}

/* Today's own copy — only needed once you browse away from what you follow. */
async function loadFollowData(){
  const id = S.ageId;
  if (!id) { S.followFx = null; return; }
  const fx = await api.getFixtures(id);
  if (S.ageId !== id) return;
  S.followFx = fx;
  render();
}

/* Match-day background poll. Unlike load() it never blanks the screen first:
   it fetches, then swaps, so nothing you are reading turns into a spinner. */
async function refresh(){
  const bid = S.browseId, aid = S.ageId;
  const jobs = [];
  if (bid) jobs.push(Promise.all([api.getFixtures(bid), api.getStandings(bid)]).then(([fx, st]) => {
    if (S.browseId !== bid) return;
    S.fixtures = fx; S.standings = st;
    if (bid === S.ageId) S.followFx = fx;
  }));
  if (aid && aid !== bid) jobs.push(api.getFixtures(aid).then((fx) => {
    if (S.ageId === aid) S.followFx = fx;
  }));
  await Promise.all(jobs);
  render();
}

/* ---------------- shared bits ---------------- */
function pills(){
  return `<div class="pill-row">${S.ageGroups.map(a =>
    `<button class="pill ${a.id===S.browseId?'on':''} ${isSat(a.id)?'':'sun'}" data-age="${a.id}">${esc(a.name)}</button>`).join('')}</div>`;
}

/* Which of the two days this age group plays on. The app has always known
   (dayOf drives the countdown) but never showed it. The date text comes from the
   venue layout rather than being typed here, so moving a day in the back office
   moves it on this tag too. */
function dayTag(agId){
  if (!agId) return '';
  const sat = isSat(agId);
  return `<div class="daytag ${sat?'':'sun'}">
      <span class="daytag-n">DAY ${sat?'01':'02'}</span>
      <span class="daytag-d">${esc(api.dayLabelOfAgeGroup(agId))}</span>
    </div>`;
}
function comingSoon(what, agId){
  return `<div class="card"><div class="empty">
    <span class="cs-pill">Coming soon</span>
    <b>${what} not published yet</b>
    <div>The draw for ${esc(ageName(agId))} hasn’t been released. It will appear here as soon as the organisers publish it.</div>
  </div></div>`;
}
/* Every row, table and bracket now shows the code (ADH1) rather than the full
   club name — a phone screen has room for one or the other, and codes are
   what fits everywhere consistently. This is the one place the mapping is
   spelled out, and it is opt-in: a small "Key" pill under the section title
   opens it in the existing bottom sheet, rather than a card repeated at the
   foot of Fixtures, Results AND Tables every time you switch tabs. */
function teamKeyList(){
  const list = (api.teamKey ? api.teamKey(S.browseId) : []);
  if (!list.length) return [];
  /* Only explain codes that are actually visible. A custom draw carries full
     club names everywhere, so there is no code to decode and the key drops out
     entirely rather than listing nine codes that appear nowhere. */
  const shown = new Set();
  const fx = S.fixtures;
  if (fx) (fx.pool || []).concat(fx.knockout || []).forEach(m => {
    if (m.home) shown.add(m.home);
    if (m.away) shown.add(m.away);
  });
  ((S.standings || {}).pools || []).forEach(p => (p.teams || []).forEach(t => shown.add(t)));
  return list.filter(k => shown.has(k.code));
}
function teamKeyContent(){
  const used = teamKeyList();
  if (!used.length) return '';
  return `<div class="card"><div class="keygrid">
    ${used.map(k => `<span class="keyrow">${k.logoSrc ? `<img class="tlogo" src="${esc(k.logoSrc)}" alt="">` : ''}<span class="keycode">${esc(k.code)}</span><span class="keyname">${esc(k.name)}</span></span>`).join('')}
  </div></div>`;
}
function teamKeyButton(){
  return teamKeyList().length ? `<button class="keybtn" data-act="teamkey">Key</button>` : '';
}

/* hideScore: Fixtures is the schedule now — when and where. Scores have
   their own tab, so a played match carries a quiet "Full time" mark here
   instead of repeating the scoreline. Tapping the row still shows it. */
function matchRow(m, agId, hideScore){
  const r = m.result, mine = isMine(m);
  const at = kickoffAt(m, agId || S.browseId);
  const soon = !r && at && (at.getTime() - Date.now()) < 45*60*1000 && (at.getTime() - Date.now()) > -75*60*1000;
  const meta = esc(m.poolName || m.round || '')
    + (soon ? `<span class="chip chip-next">${esc(untilText(at))}</span>` : '')
    + (r && hideScore ? `<span class="chip chip-ft">Full time</span>` : '');
  return `<button class="mrow ${mine?'mine':''}" data-match="${esc(m.id)}">
    <div><div class="mtime">${esc(m.time || '')}</div><div class="mpitch">${esc(m.pitch || 'TBD')}</div></div>
    <div><div class="mteams">${m.home ? tBadge(m.home) : 'TBD'} <span class="muted">v</span> ${m.away ? tBadge(m.away) : 'TBD'}</div>
      <div class="mmeta">${meta}</div></div>
    <div>${r && !hideScore ? `<span class="mscore">${r.homeScore}&ndash;${r.awayScore}</span>` : ICON.chev}</div>
  </button>`;
}

/* ---------------- Today ---------------- */
/* animate=true only on a deliberate tab change. A data refresh re-renders too,
   and animating that would make the screen twitch every time a score lands. */
function render(animate){
  paintRole();
  const m = $('main');
  m.innerHTML = S.view==='today' ? viewToday()
              : S.view==='fixtures' ? viewFixtures()
              : S.view==='results' ? viewResults()
              : S.view==='tables' ? viewTables() : viewMore();
  if (animate) {
    m.classList.remove('main-anim');
    void m.offsetWidth;            // force a reflow so the animation restarts
    m.classList.add('main-anim');
  }
  wire();
}

function followCard(){
  const following = S.team ? tShort(S.team) : (S.ageId ? ageName(S.ageId) : null);
  if (!following) {
    return `<button class="tcard" data-act="follow" style="width:100%;text-align:left">
      <div class="tcard-k">Get started</div>
      <div class="tcard-n">Follow your team</div>
      <div class="tcard-m">Pick an age group and we’ll show you its fixtures, results and pool table first.</div>
    </button>`;
  }

  const fx = S.followFx;
  const all = fx && !fx.awaitingPublication
    ? (fx.pool || []).concat((fx.knockout || []).filter(k => k.home || k.away)) : [];
  const mine = S.team ? all.filter(isMine) : all;
  const next = mine.find(m => !m.result);
  const last = [...mine].reverse().find(m => m.result);

  let inner = '';
  if (next) {
    const at = kickoffAt(next, S.ageId);
    const opp = S.team ? (sameTeam(next.home, S.team) ? next.away : next.home) : `${next.home} v ${next.away}`;
    inner = `<div class="tcard-m" style="margin-top:12px">
        <strong style="color:#fff">${S.team ? 'v ' + tBadge(opp) : esc(opp)}</strong><br>
        ${esc(next.time || '')} &middot; ${esc(next.pitch || 'Pitch TBD')} &middot; ${esc(next.poolName || next.round || '')}
      </div>${at && untilText(at) ? `<div class="kick"><div style="flex:none;padding-left:14px;padding-right:14px"><b>${esc(untilText(at))}</b></div></div>` : ''}`;
  } else if (fx && fx.awaitingPublication) {
    inner = `<div class="tcard-m" style="margin-top:12px">Fixtures for this age group haven’t been published yet.</div>`;
  } else if (mine.length) {
    inner = `<div class="tcard-m" style="margin-top:12px">All matches played.</div>`;
  }

  const lastLine = last
    ? `<div class="tcard-m" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)">
         Last: ${tBadge(last.home)} ${last.result.homeScore}&ndash;${last.result.awayScore} ${tBadge(last.away)}</div>` : '';

  return `<div class="tcard">
    <button class="tcard-cta" data-act="follow">Change</button>
    <div class="tcard-k">${S.team ? 'Following' : 'Following age group'}</div>
    <div class="tcard-n">${S.team ? tLogoImg(S.team) : ''}${esc(following)}</div>
    ${S.team ? `<div class="tcard-m" style="margin-top:4px">${esc(tName(S.team))} &middot; ${esc(ageName(S.ageId))}</div>` : ''}
    ${inner}${lastLine}
  </div>`;
}

/* Rewrites only the four digit cells. The rest of the tab — and every button
   on it — survives untouched between seconds. */
function tickCountdown(){
  if (!$('cd-d')) return;
  const diff = Math.max(0, KICKOFF.getTime() - Date.now());
  const p2 = (v) => String(v).padStart(2,'0');
  $('cd-d').textContent = Math.floor(diff/86400000);
  $('cd-h').textContent = p2(Math.floor(diff/3600000)%24);
  $('cd-m').textContent = p2(Math.floor(diff/60000)%60);
  $('cd-s').textContent = p2(Math.floor(diff/1000)%60);
}

function viewToday(){
  const p = phase();
  const diff = Math.max(0, KICKOFF.getTime() - Date.now());
  const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24,
        mi = Math.floor(diff/60000)%60, se = Math.floor(diff/1000)%60;

  let hero;
  if (p === 'before') {
    hero = `<div class="hero">
      <div class="hero-k">Sat 7 &amp; Sun 8 November 2026</div>
      <div class="hero-h">Two big days<br>of junior rugby</div>
      <div class="hero-p">Zayed Sports City, Abu Dhabi &middot; Gate 16</div>
      <div class="cd">
        <div><b id="cd-d">${d}</b><span>DAYS</span></div><div><b id="cd-h">${String(h).padStart(2,'0')}</b><span>HRS</span></div>
        <div><b id="cd-m">${String(mi).padStart(2,'0')}</b><span>MIN</span></div><div><b id="cd-s">${String(se).padStart(2,'0')}</b><span>SEC</span></div>
      </div></div>`;
  } else if (p === 'during') {
    const day = Date.now() < new Date(DAY2+'T00:00:00+04:00').getTime() ? 1 : 2;
    hero = `<div class="hero"><div class="hero-k">Live now &middot; day ${day}</div>
      <div class="hero-h">Match day</div>
      <div class="hero-p">Zayed Sports City &middot; Gate 16. Scores update as managers enter them.</div></div>`;
  } else {
    hero = `<div class="hero"><div class="hero-k">Tournament complete</div>
      <div class="hero-h">Thanks for<br>a great weekend</div>
      <div class="hero-p">Final tables and results are in the Tables tab.</div></div>`;
  }

  const practical = `<div class="sec-t">Before the day</div><div class="card">
      <div class="row"><div><b>Zayed Sports City</b><small>Enter via Gate 16 &middot; parking across the complex</small></div></div>
      <div class="row"><div><b>Pools kick off 8:00am</b><small>20-minute slots &mdash; two 7-minute halves</small></div></div>
      <div class="row"><div><b>What to bring</b><small>Boots, a mouthguard, water, sun cover and a folding chair</small></div></div>
    </div>
    <div class="sec-t">Registration</div><div class="card">
      <a class="row" href="/#register"><div><b>Enter a team or player</b><small>Registration is open on the tournament website</small></div>${ICON.chev}</a>
    </div>`;

  const fx = S.followFx;
  /* Knockout matches belong here too — on finals day the card above was
     naming a semi-final that these lists then refused to show. */
  const live = fx && !fx.awaitingPublication
    ? (fx.pool || []).concat((fx.knockout || []).filter(k => k.home || k.away)) : [];
  const mineList = S.team ? live.filter(isMine) : live;
  const upcoming = mineList.filter(m => !m.result).slice(0, 4);
  const recent = mineList.filter(m => m.result).slice(-3).reverse();

  const more = (upcoming.length ? `<div class="sec-t">${S.team ? 'Your fixtures' : 'Next up'}</div><div class="card">${upcoming.map(m=>matchRow(m,S.ageId)).join('')}</div>` : '')
             + (recent.length ? `<div class="sec-t">Recent results</div><div class="card">${recent.map(m=>matchRow(m,S.ageId)).join('')}</div>` : '');

  return hero + followCard() + (p === 'before' && !more ? practical : more + (p==='before' ? practical : ''));
}

/* ---------------- Fixtures & Results ---------------- */
/* Played matches, most recent first. Every score is already on its fixture
   row, but after a game people want "what just happened" without reading past
   every match still to come. Honours the same team filter as Fixtures. */
function resultsList(fx, showFilter){
  let all = (fx.pool || []).concat((fx.knockout || []).filter(k => k.home || k.away));
  if (showFilter && S.onlyMine) all = all.filter(isMine);
  const played = all.filter(m => m.result).reverse();
  if (!played.length) return `<div class="card"><div class="empty">
      <b>No results yet</b>
      <div>Scores appear here as soon as the age group managers enter them.</div>
    </div></div>`;
  return `<div class="card">${played.map(m => matchRow(m, S.browseId)).join('')}</div>`;
}

/* Shared by Fixtures and Results: whose matches to show. */
function teamSeg(){
  const showFilter = S.team && S.browseId === S.ageId;
  return { showFilter, seg: showFilter ? `<div class="seg">
      <button data-seg="mine" class="${S.onlyMine?'on':''}">${tBadge(S.team)}</button>
      <button data-seg="all" class="${!S.onlyMine?'on':''}">All matches</button>
    </div>` : '' };
}

/* Results is its own tab. Fixtures no longer repeats the scores. */
function viewResults(){
  const fx = S.fixtures;
  const head = `<div class="sec-t">Results</div>${pills()}${dayTag(S.browseId)}${teamKeyButton()}`;
  if (!fx) return head + `<div class="card"><div class="spin">Loading…</div></div>`;
  if (fx.awaitingPublication) return head + comingSoon('Results', S.browseId);
  const { showFilter, seg } = teamSeg();
  return head + seg + resultsList(fx, showFilter);
}

function viewFixtures(){
  const fx = S.fixtures;
  const head = `<div class="sec-t">Fixtures</div>${pills()}${dayTag(S.browseId)}${teamKeyButton()}`;
  if (!fx) return head + `<div class="card"><div class="spin">Loading…</div></div>`;
  if (fx.awaitingPublication) return head + comingSoon('Fixtures', S.browseId);

  const { showFilter, seg } = teamSeg();

  let pool = fx.pool || [];
  if (showFilter && S.onlyMine) pool = pool.filter(isMine);

  /* Grouped by pool — twenty undifferentiated rows is hard to scan, and the
     pool is how people think about the draw. */
  const byPool = {};
  pool.forEach(m => { const k = m.poolName || 'Matches'; (byPool[k] = byPool[k] || []).push(m); });
  const groups = Object.keys(byPool).map(k =>
    `<div class="pool-h">${esc(k)}</div>${byPool[k].map(m=>matchRow(m,S.browseId,true)).join('')}`).join('');

  const ko = (fx.knockout || []).filter(k => k.home || k.away);
  return head + seg
    + `<div class="card">${groups || '<div class="empty"><b>No matches</b><div>Nothing scheduled here yet.</div></div>'}</div>`
    + (ko.length && !(showFilter && S.onlyMine) ? `<div class="sec-t">Knockout</div><div class="card">${ko.map(m=>matchRow(m,S.browseId,true)).join('')}</div>` : '');
}

/* ---------------- Tables ---------------- */
function viewTables(){
  const st = S.standings;
  const head = `<div class="sec-t">Tables</div>${pills()}${dayTag(S.browseId)}${teamKeyButton()}`;
  if (!st) return head + `<div class="card"><div class="spin">Loading…</div></div>`;
  if (st.awaitingPublication) return head + comingSoon('Standings', S.browseId);
  if (!st.ageGroup.hasStandings) return head +
    `<div class="card"><div class="empty"><b>Festival age group</b>
     <div>${esc(st.ageGroup.name)} is non-competitive — no standings are kept.</div></div></div>`;

  const pools = st.pools || [];
  if (!pools.length) return head +
    `<div class="card"><div class="empty"><b>No pools yet</b><div>Nothing to show for this age group.</div></div></div>`;

  const adv = st._advance || 0;
  return head + pools.map(p => {
    const rows = st.tables[p.id] || [];
    return `<div class="sec-t">${esc(p.name)}</div><div class="card"><div class="tscroll"><table>
      <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>PA</th><th>+/−</th><th>Pts</th></tr></thead>
      <tbody>${rows.map((t,i) => `<tr class="${i<adv?'q':''} ${sameTeam(t.team, S.team)?'me':''}">
        <td>${i+1}</td><td>${tBadge(t.team)}</td><td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td>
        <td>${t.PF}</td><td>${t.PA}</td><td>${t.PF-t.PA>0?'+':''}${t.PF-t.PA}</td><td class="pts">${t.pts}</td></tr>`).join('')}</tbody></table></div>
      <div class="legend">Green bar = qualifies for the knockout stage. P played · W/D/L won, drawn, lost · +/- points difference · Pts league points. On a narrow phone PF and PA (points for and against) are hidden to make the table fit; turn the phone sideways to see them. The position and team columns stay put if you do need to scroll.</div>
    </div>`;
  }).join('');
}

/* ---------------- More ---------------- */
function viewMore(){
  const s = S.session;
  return `<div class="sec-t">Venue</div><div class="card">
      <div class="row"><div><b>Zayed Sports City</b><small>Abu Dhabi &middot; enter via Gate 16</small></div></div>
      <div class="row"><div><b>Pitches A, B, C &amp; D</b><small>Follow the Quins signage from the Tennis Centre</small></div></div>
      <div class="row"><div><b>Sat 7 &amp; Sun 8 November 2026</b><small>Pools kick off 8:00am</small></div></div>
      <button class="row" data-act="venuemap"><div><b>Pitch map</b><small>The venue layout, as on the website</small></div>${ICON.chev}</button>
    </div>

    <div class="sec-t">Following</div><div class="card">
      <button class="row" data-act="follow"><div><b>${esc(S.team || (S.ageId ? ageName(S.ageId) : 'Not set'))}</b>
        <small>${S.team ? esc(ageName(S.ageId)) : 'Choose the team or age group you follow'}</small></div>${ICON.chev}</button>
    </div>

    <div class="sec-t">${s ? 'Your account' : 'Managers &amp; organisers'}</div><div class="card">
      ${s ? `<div class="row"><div><b>${esc(s.name || s.username)}</b>
          <small>${isOrganiser(s) ? 'Organiser — all age groups' : (s.ageGroupId==='*' ? 'Admin — all age groups' : ageName(s.ageGroupId))}</small></div></div>
        <button class="row" data-act="tools"><div><b>Full manager tools</b><small>Fixture editor, publishing, spirit award</small></div>${ICON.chev}</button>
        <button class="row" data-act="signout"><div><b>Sign out</b></div>${ICON.chev}</button>`
       : `<button class="row" data-act="signin"><div><b>Sign in</b><small>Enter scores for your age group</small></div>${ICON.chev}</button>`}
    </div>

    <div class="sec-t">More</div><div class="card">
      <a class="row" href="/"><div><b>Tournament website</b><small>About, registration, sponsors</small></div>${ICON.chev}</a>
      <a class="row" href="/scores"><div><b>Full scores page</b><small>Brackets and the complete standings view</small></div>${ICON.chev}</a>
    </div>
    <p class="muted" style="padding:18px 4px;font-size:12.5px;line-height:1.6">
      Abu Dhabi Harlequins Rugby Football Club &middot; founded 1970<br>Affiliated with Harlequin F.C. London</p>`;
}

/* ---------------- interactions ---------------- */
/* Fifteen age-group pills do not fit across a phone, so the selected one is
   usually off to the right and you had to scroll to find out where you were.
   Centre it in its scroller after every render.

   Done by setting scrollLeft rather than scrollIntoView(): scrollIntoView also
   scrolls the nearest vertical scroller, which on this layout is the page, so
   it would jump the whole screen. The row is rebuilt by every render anyway
   (innerHTML resets scrollLeft to 0), so this never fights a manual scroll. */
function centreActivePill(){
  const row = document.querySelector('.pill-row');
  if (!row) return;
  const on = row.querySelector('.pill.on');
  if (!on) return;
  const target = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  row.scrollLeft = Math.max(0, target);
}

function wire(){
  document.querySelectorAll('[data-age]').forEach(b => b.onclick = () => load(b.dataset.age));
  document.querySelectorAll('[data-match]').forEach(b => b.onclick = () => openMatch(b.dataset.match));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
  document.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { S.onlyMine = b.dataset.seg==='mine'; render(); });
  centreActivePill();
}

function act(a){
  if (a === 'follow')  return openFollow();
  if (a === 'signin')  return signIn();
  if (a === 'signout') { api.logout(); try{orgApi.logout();}catch(e){} S.session=null; render(); toast('Signed out'); return; }
  if (a === 'tools')   { location.href = '/scores'; return; }
  if (a === 'venuemap') return openSheet('Venue map',
    `<img class="vmap" src="/assets/venue-map.png" alt="Zayed Sports City pitch layout" loading="lazy">
     <p class="muted" style="margin-top:14px;font-size:13px;line-height:1.6">
       Zayed Sports City, Abu Dhabi · enter via Gate 16.</p>`);
  if (a === 'teamkey') return openSheet('Team key', teamKeyContent());
}

/* Two-stage: age group always, then narrow to a team once the draw exists. */
function openFollow(){
  const list = S.ageGroups.map(a =>
    `<button class="row" data-pick-age="${a.id}"><div><b>${esc(a.name)}</b>${a.id===S.ageId?'<small>Currently following</small>':''}</div>${ICON.chev}</button>`).join('');
  openSheet('Choose age group', `<div class="card">${list}</div>
    <p class="muted" style="margin-top:16px;font-size:13px;line-height:1.6">
      Once the draw is published you can narrow this to your own team, and the app will show your fixtures first.</p>`);
  document.querySelectorAll('[data-pick-age]').forEach(b => b.onclick = async () => {
    S.ageId = b.dataset.pickAge; S.team = null; saveFollow();
    closeSheet(); await load(S.ageId); openTeamPick();
  });
}

function openTeamPick(){
  const teams = teamsInAge();
  if (!teams.length) { toast('Following ' + ageName(S.ageId)); return; }
  /* "All teams" leads. It is the option someone reaches for when they are
     backing out of a team choice, and hunting for it under a list of nine
     clubs is the wrong way round. Matches the age chooser, which also flags
     what you are on now. */
  openSheet('Choose your team', `<div class="card">
      <button class="row" data-pick-team=""><div><b>All teams</b><small>${!S.team ? 'Currently following' : 'Follow the whole age group'}</small></div>${ICON.chev}</button>
      ${teams.map(t => `<button class="row" data-pick-team="${esc(t)}"><div><b>${tBadge(t)}</b><small>${S.team === t ? 'Currently following' : esc(tName(t))}</small></div>${ICON.chev}</button>`).join('')}
    </div>`);
  document.querySelectorAll('[data-pick-team]').forEach(b => b.onclick = () => {
    S.team = b.dataset.pickTeam || null; saveFollow(); closeSheet(); S.onlyMine = true; render();
    toast(S.team ? 'Following ' + tShort(S.team) : 'Following ' + ageName(S.ageId));
  });
}

function signIn(){
  openSheet('Sign in', `<div id="loginErr"></div>
    <div class="field"><label>Username</label><input id="lu" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <button class="btn btn-p" id="lgo">Sign in</button>
    <p class="muted" style="margin-top:16px;font-size:13px;line-height:1.6">
      Managers use the account they created with their age group invite code.
      Organisers use their organiser account — both work here.</p>`);
  $('lgo').onclick = async () => {
    const u = $('lu').value.trim(), p = $('lp').value;
    if (!u || !p) { $('loginErr').innerHTML = '<div class="err">Enter your username and password.</div>'; return; }
    $('lgo').textContent = 'Signing in…';
    let r = await api.login(u, p);
    if (!r.ok) { const o = await orgApi.login(u, p); if (o.ok) r = o; }
    if (r.ok) {
      S.session = resolveSession(); closeSheet();
      const ag = S.session && S.session.ageGroupId;
      if (ag && ag !== '*' && S.ageGroups.some(a => a.id === ag)) await load(ag); else render();
      toast('Signed in');
    } else {
      $('loginErr').innerHTML = '<div class="err">Wrong username or password. Managers use their age group account; organisers use their organiser account.</div>';
      $('lgo').textContent = 'Sign in';
    }
  };
}

/* Every match id is "<ageGroupId>:<pool>:<i>-<j>" — the same convention the
   backend uses to re-derive permissions. Reading the age group off the id is
   what lets a match opened from Today be scored against its OWN group rather
   than whatever the Fixtures tab happens to be showing. */
const ageOfMatch = (id) => String(id || '').split(':')[0];

function findMatch(id){
  for (const fx of [S.fixtures, S.followFx]) {
    if (!fx) continue;
    const m = (fx.pool || []).concat(fx.knockout || []).find(x => x.id === id);
    if (m) return m;
  }
  return null;
}

function openMatch(id){
  const m = findMatch(id); if (!m) return;
  const agId = ageOfMatch(m.id) || S.browseId;
  const r = m.result, mayScore = canScore(S.session, agId);
  const at = kickoffAt(m, agId);

  /* After a write, refresh whichever loaded copy this match belongs to. */
  const afterWrite = async () => {
    if (agId === S.browseId) await load(agId);
    else if (agId === S.ageId) await loadFollowData();
  };

  const head = `<div class="card" style="margin-bottom:16px">
      <div class="row"><div><b>${m.home?tBadge(m.home):'TBD'} v ${m.away?tBadge(m.away):'TBD'}</b>
        <small>${esc(m.poolName||m.round||'')} &middot; ${esc(m.time||'')} &middot; ${esc(m.pitch||'Pitch TBD')}${at&&untilText(at)?' &middot; '+esc(untilText(at)):''}</small></div></div>
      ${r ? `<div class="row"><div><b style="font-family:'Anton';font-size:26px">${r.homeScore} &ndash; ${r.awayScore}</b>
        <small>Tries ${r.homeTries||0}&ndash;${r.awayTries||0}${r.walkover?' &middot; walk-over':''}</small></div></div>` : ''}
    </div>`;

  if (!mayScore) return openSheet('Match', head + (r ? '' :
    `<p class="muted" style="font-size:13.5px;line-height:1.6">No result yet. Scores appear here as soon as the age group manager enters them.</p>`));

  /* Inputs are built from the age group's scoring rules, so a U10 manager is
     never shown a conversions box for a kick that does not exist at that age.
     The total updates as you type — nobody adds up 5s, 2s and 3s under
     pressure at a pitch — and the server recomputes it from the same rules. */
  const parts = api.scoringFor(agId);
  /* label is already-safe HTML (a crest + escaped code, or a plain literal
     like 'Home') — built by the caller via tBadge(), never raw user input. */
  const sideInputs = (side, label) => `
    <div class="scoreblock">
      <div class="sb-head"><span>${label}</span><b id="tot-${side}">0</b></div>
      ${parts.map(k => `
        <div class="sb-row">
          <label for="${side}-${k}">${esc(api.scoreLabel(k))} <span class="sb-pts">${api.scorePoints(k)} pts</span></label>
          <input id="${side}-${k}" class="sb-in" type="number" inputmode="numeric" min="0" step="1"
                 value="${r ? (r[side + k.charAt(0).toUpperCase() + k.slice(1)] || 0) : 0}">
        </div>`).join('')}
    </div>`;

  openSheet('Enter score', head + `<div id="scErr"></div>
    ${sideInputs('home', m.home ? tBadge(m.home) : 'Home')}
    ${sideInputs('away', m.away ? tBadge(m.away) : 'Away')}
    <div class="field" style="margin-top:4px"><label>Walk-over</label><select id="wo">
      <option value="">No walk-over</option>
      <option value="home" ${r&&r.walkover==='home'?'selected':''}>${esc(m.home?tShort(m.home):'Home')} awarded the match</option>
      <option value="away" ${r&&r.walkover==='away'?'selected':''}>${esc(m.away?tShort(m.away):'Away')} awarded the match</option>
    </select><p class="muted" style="font-size:12px;margin-top:6px">A walk-over is recorded as 20&ndash;0 with 4 tries.</p></div>
    <button class="btn btn-g" id="sgo">${r?'Update result':'Save result'}</button>
    ${r ? `<button class="btn btn-o" id="sclr" style="margin-top:10px;color:#c0392b">Clear result</button>
      <p class="muted" style="font-size:12px;margin-top:8px;line-height:1.5">Clearing puts the match back to unplayed. It is not the same as saving 0&ndash;0, which is a draw worth two league points each.</p>` : ''}`);

  const readSide = (side) => {
    const o = {};
    parts.forEach(k => { o[k] = Number(($(`${side}-${k}`) || {}).value || 0); });
    return o;
  };
  const recalc = () => {
    const wo = $('wo').value;
    ['home','away'].forEach(side => {
      const t = wo ? (wo === side ? 20 : 0) : api.scoreTotal(agId, readSide(side));
      $('tot-' + side).textContent = t;
    });
    const off = !!$('wo').value;
    parts.forEach(k => ['home','away'].forEach(side => {
      const el = $(`${side}-${k}`); if (el) { el.disabled = off; el.style.opacity = off ? .45 : 1; }
    }));
  };
  parts.forEach(k => ['home','away'].forEach(side => {
    const el = $(`${side}-${k}`); if (el) el.oninput = recalc;
  }));
  $('wo').onchange = recalc;
  recalc();

  if (r && $('sclr')) $('sclr').onclick = async () => {
    if (!confirm('Clear this result? The match goes back to unplayed and the pool table is recalculated.')) return;
    $('sclr').textContent = 'Clearing…';
    const res = await api.clearResult(m.id, S.session);
    if (res.ok) { closeSheet(); toast('Result cleared'); await afterWrite(); }
    else { $('scErr').innerHTML = `<div class="err">${esc(res.error||'Could not clear.')}</div>`; $('sclr').textContent = 'Clear result'; }
  };

  $('sgo').onclick = async () => {
    const wo = $('wo').value;
    /* An all-zero save is a real 0-0 draw. Worth confirming, because the more
       likely intent is to clear a result that was entered by mistake. */
    if (!wo) {
      const zero = ['home','away'].every(side => parts.every(k => !Number(($(`${side}-${k}`)||{}).value || 0)));
      if (zero && !confirm('Save this as a 0–0 draw? Both teams get two league points.\n\nTo remove the result instead, use Clear result.')) {
        return;
      }
    }
    $('sgo').textContent = 'Saving…';
    const payload = { walkover: wo || null };
    ['home','away'].forEach(side => parts.forEach(k => {
      payload[side + k.charAt(0).toUpperCase() + k.slice(1)] = Number(($(`${side}-${k}`)||{}).value || 0);
    }));
    const res = await api.submitResult(m.id, payload, S.session);
    /* Read the score back off the SERVER's reply, not off the form. The server
       computes the totals and confirms the write landed before it answers
       (submit-result.js), so showing its figures is the manager's proof the
       score is actually stored — not just that the button was pressed. */
    if (res.ok) {
      closeSheet();
      toast(res.stored ? `Saved ${res.stored.homeScore}–${res.stored.awayScore}` : 'Result saved');
      await afterWrite();
    }
    else { $('scErr').innerHTML = `<div class="err">${esc(res.error||'Could not save.')}</div>`; $('sgo').textContent='Save result'; }
  };
}

/* ---------------- boot ---------------- */
(async function init(){
  S.session = resolveSession();
  // Live scoring rules decide which inputs the score form offers.
  if (api.loadScoringRules) { try { await api.loadScoringRules(); } catch (e) {} }
  /* U6 and U7 are festival groups (hasStandings:false). They still have
     fixtures, still have a manager who has to enter scores, and are still
     followed by parents — so they belong in the app. Filtering them out here
     locked their managers out of it completely and left the Tables tab's own
     "festival age group" message unreachable. Only public STANDINGS hide
     them, and viewTables already handles that. */
  S.ageGroups = await api.getAgeGroups();
  loadFollow();

  const mgrAge = S.session && S.session.ageGroupId !== '*' ? S.session.ageGroupId : null;
  if (mgrAge && S.ageGroups.some(a => a.id === mgrAge)) S.ageId = mgrAge;
  if (!S.ageId || !S.ageGroups.some(a => a.id === S.ageId))
    S.ageId = (S.ageGroups.find(a => a.hasStandings) || S.ageGroups[0] || {}).id;

  buildNav();
  await load(S.ageId);

  /* The countdown used to be driven by re-rendering the whole Today tab every
     second, which threw away and rebuilt every button on it — a tap landing in
     the wrong frame hit an element that no longer existed and did nothing.
     Now only the digits are written, and a full render happens once, when the
     phase actually changes (before -> during -> after). */
  let lastPhase = phase();
  setInterval(() => {
    const p = phase();
    if (p !== lastPhase) { lastPhase = p; render(); return; }
    if (p === 'before' && S.view === 'today') tickCountdown();
  }, 1000);

  /* Match-day polling, skipped while a sheet is open so a score being typed is
     never disturbed. */
  setInterval(() => { if (phase() === 'during' && !sheetOpen()) refresh(); }, 60000);
})();
</script>

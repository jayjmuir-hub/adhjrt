[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/Quins JRT.dc.html"
  status = 200

[[redirects]]
  from = "/organizer"
  to = "/Organizer.dc.html"
  status = 200

[[redirects]]
  from = "/scores"
  to = "/Scores & Standings.dc.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/manager"
  to = "/Manager.dc.html"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/Signin.dc.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

# The club declaration form (Aug 2026) — the "silent link".
# ⚠️ UNLISTED, NOT PROTECTED. Nothing on adhjrt.com links here, it is absent
# from sitemap.xml and the page carries noindex — but this repo is PUBLIC and
# its root is the deployed site, so this very rule tells anyone reading the
# source that the path exists. What actually guards it is CLUB_FORM_KEY,
# checked server-side in _intake.js; without the key the form cannot submit.
# Deliberately NOT added to robots.txt as a Disallow: that file is public too,
# so a Disallow would advertise the path to exactly the people it is hidden
# from. noindex does the same job without naming it anywhere public.
[[redirects]]
  from = "/register-club"
  to = "/Club.dc.html"
  status = 200

# The three page files reference /assets/icons/apple-touch-icon.png, but the
# icons live directly in /assets/. This rewrite makes both paths work so the
# pages did not need re-uploading. Safe to delete once those hrefs are
# corrected in the .dc.html files.
[[redirects]]
  from = "/assets/icons/*"
  to = "/assets/:splat"
  status = 200

# --- tests -------------------------------------------------------------
# No publish directory is set, so the repo root IS the deployed site and
# tests/ would otherwise be readable at adhjrt.com/tests/. Netlify has no way
# to exclude a folder from a no-build deploy, so a 404 rule is the mechanism.
# force = true because these are real files on disk and would be served before
# the rule was consulted otherwise.
#
# This is tidiness, NOT security: the repo is public, so nothing in tests/
# should ever be secret in the first place. See tests/README.md step 1 — the
# data check that has to happen before the older test files move in.
#
# ⚠️ FIXED 5 Aug 2026 — THIS RULE HAD NEVER WORKED. It used to say
#     to = "/tests/:splat"
# i.e. it pointed at itself. Netlify drops a self-referential redirect rather
# than applying it, so /tests/runall.ps1 was being served with a plain 200 for
# as long as the rule had existed, while this comment claimed otherwise.
# Caught by actually requesting the URL on the deployed site instead of
# trusting the config. The target has to be a DIFFERENT path — 404.html — for
# the status to be applied.
#
# If you touch this, re-test it by fetching /tests/runall.ps1 on a deploy and
# checking for 404. Reading the toml proves nothing; that is how it went
# unnoticed in the first place.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

# --- tools -------------------------------------------------------------
# Same reasoning as tests/ directly above: no publish directory, so
# tools/make-board-photo.py would otherwise be readable at
# adhjrt.com/tools/make-board-photo.py. It holds nothing secret — the repo is
# public — but a local build script is not part of the site and should not be
# served as if it were. force = true for the same reason: it is a real file on
# disk and would be served before this rule was consulted.
#
# Note `to = "/404.html"`, NOT "/tools/:splat". Pointing a redirect at itself
# makes Netlify drop it silently — see the tests/ block above, where exactly
# that mistake sat unnoticed. I made the same mistake here first and caught it
# by fetching the URL on the deploy.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# --- PWA ---------------------------------------------------------------
# The service worker must never be cached, or a stale copy can pin the site
# to an old version long after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# --- About-section ring photos -----------------------------------------
# assets/board/board-NN{,-sm}.{avif,webp} are content-addressed by hand: a
# given filename always holds the same photo, because replacing a photo means
# running tools/make-board-photo.py at a NEW number, never overwriting an old
# one. That makes them safe to cache for a year and mark immutable, so a
# returning visitor re-downloads none of them.
#
# ⚠️ The corollary, and the way this bites: if you ever DO overwrite an
# existing board-NN file in place, anyone who has already visited keeps the old
# photo for up to a year and no deploy will shift it. Always add at a new
# number. The generator script picks the next free one for you by default,
# which is precisely why it does that.
[[headers]]
  for = "/assets/board/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/Quins JRT.dc.html"
  status = 200

[[redirects]]
  from = "/organizer"
  to = "/Organizer.dc.html"
  status = 200

[[redirects]]
  from = "/scores"
  to = "/Scores & Standings.dc.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/manager"
  to = "/Manager.dc.html"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/Signin.dc.html"
  status = 200

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

# The tournament rules page (5 Aug 2026). Same shape as /legal: a plain static
# file, not a DC component. Deliberately INDEXABLE and in sitemap.xml, unlike
# /register-club - parents and coaches should be able to find the rules.
[[redirects]]
  from = "/rules"
  to = "/rules.html"
  status = 200

# The club declaration form (Aug 2026) — the "silent link".
# ⚠️ UNLISTED, NOT PROTECTED. Nothing on adhjrt.com links here, it is absent
# from sitemap.xml and the page carries noindex — but this repo is PUBLIC and
# its root is the deployed site, so this very rule tells anyone reading the
# source that the path exists. What actually guards it is CLUB_FORM_KEY,
# checked server-side in _intake.js; without the key the form cannot submit.
# Deliberately NOT added to robots.txt as a Disallow: that file is public too,
# so a Disallow would advertise the path to exactly the people it is hidden
# from. noindex does the same job without naming it anywhere public.
#
# ⚠️ CORRECTED 9 Aug 2026 — "the page carries noindex" WAS NOT TRUE when this
# comment was written, and had never been true. The tag sat inside <helmet> in
# the BODY, and support.js moved it into document.head at runtime — so it
# existed only after JavaScript ran, and a crawler that ignores JavaScript
# ignored it too. The sentence above described a control that was not there.
# The tag is now in the literal <head> of Club.dc.html, where a crawler sees it
# without executing anything, and test-head-metadata.js holds it there.
# The lesson is not about this tag: a comment asserting a security property is
# worth nothing unless something checks the property.
[[redirects]]
  from = "/register-club"
  to = "/Club.dc.html"
  status = 200

# The three page files reference /assets/icons/apple-touch-icon.png, but the
# icons live directly in /assets/. This rewrite makes both paths work so the
# pages did not need re-uploading. Safe to delete once those hrefs are
# corrected in the .dc.html files.
[[redirects]]
  from = "/assets/icons/*"
  to = "/assets/:splat"
  status = 200

# --- tests -------------------------------------------------------------
# No publish directory is set, so the repo root IS the deployed site and
# tests/ would otherwise be readable at adhjrt.com/tests/. Netlify has no way
# to exclude a folder from a no-build deploy, so a 404 rule is the mechanism.
# force = true because these are real files on disk and would be served before
# the rule was consulted otherwise.
#
# This is tidiness, NOT security: the repo is public, so nothing in tests/
# should ever be secret in the first place. See tests/README.md step 1 — the
# data check that has to happen before the older test files move in.
#
# ⚠️ FIXED 5 Aug 2026 — THIS RULE HAD NEVER WORKED. It used to say
#     to = "/tests/:splat"
# i.e. it pointed at itself. Netlify drops a self-referential redirect rather
# than applying it, so /tests/runall.ps1 was being served with a plain 200 for
# as long as the rule had existed, while this comment claimed otherwise.
# Caught by actually requesting the URL on the deployed site instead of
# trusting the config. The target has to be a DIFFERENT path — 404.html — for
# the status to be applied.
#
# If you touch this, re-test it by fetching /tests/runall.ps1 on a deploy and
# checking for 404. Reading the toml proves nothing; that is how it went
# unnoticed in the first place.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

# --- tools -------------------------------------------------------------
# Same reasoning as tests/ directly above: no publish directory, so
# tools/make-board-photo.py would otherwise be readable at
# adhjrt.com/tools/make-board-photo.py. It holds nothing secret — the repo is
# public — but a local build script is not part of the site and should not be
# served as if it were. force = true for the same reason: it is a real file on
# disk and would be served before this rule was consulted.
#
# Note `to = "/404.html"`, NOT "/tools/:splat". Pointing a redirect at itself
# makes Netlify drop it silently — see the tests/ block above, where exactly
# that mistake sat unnoticed. I made the same mistake here first and caught it
# by fetching the URL on the deploy.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# --- claude docs -------------------------------------------------------
# Same reasoning as tests/ and tools/ above. The claude/ folder holds the
# project's own documentation — specs, plans, runbooks, status. It was moved
# into this repo on 7 Aug 2026 so that a bare clone is self-sufficient; before
# that, CLAUDE.md pointed at fourteen paths a clone could not see.
#
# No publish directory is set, so without this rule adhjrt.com/claude/state-of-play.md
# would be served as a plain 200. Nothing in there is secret — it was scanned
# file by file before it was committed and personal data was redacted — but
# internal documentation is not part of the site and should not be served as
# if it were.
#
# force = true because these are real files on disk and would otherwise be
# served before this rule was consulted.
#
# ⚠️ to = "/404.html", NOT "/claude/:splat". A redirect that points at itself
# is silently DROPPED by Netlify rather than applied — that mistake sat
# unnoticed on the tests/ rule for months while the comment above it claimed
# otherwise. See the tests/ block above.
#
# ✅ VERIFIED 8 Aug 2026, and verified in the way that DISCRIMINATES.
# On a deploy carrying this rule, /claude/state-of-play.md, /claude/lessons.md
# and /claude/archive/pr11-status.md all returned 404 WHILE /CLAUDE.md — the
# same file type, in the same snapshot, with no rule at the time — returned
# 200. A 404 on its own proves nothing here, because a file that is simply
# absent 404s identically; the 200 on an unruled sibling is what makes it a
# real measurement. Controls: / and /robots.txt 200, /no-such-xyz 404.
#
# ⚠️ AND IT DOES NOT MAKE THESE DOCS PRIVATE. This repo is PUBLIC: every file
# here is readable on github.com regardless of what Netlify serves. This rule
# is about not serving them as part of the website, nothing more.
[[redirects]]
  from = "/claude/*"
  to = "/404.html"
  status = 404
  force = true

# --- root-level docs ---------------------------------------------------
# CLAUDE.md and RESTORE.md live in the repo ROOT, and the root IS the site.
# ⚠️ MEASURED 7 Aug 2026: adhjrt.com/CLAUDE.md returned 200 and served the
# whole file. It had been doing so for months, and the /claude/* rule added
# earlier the same day does NOT cover root-level paths — so RESTORE.md was
# about to start doing the same on the next deploy.
#
# Nothing in either file is secret; the repo is public and both are readable on
# github.com regardless. This is about not serving internal documentation as
# part of the website.
#
# ✅ VERIFIED 8 Aug 2026 BY A REAL BEFORE/AFTER, which is why this rule was
# written this way. Baseline taken BEFORE: production served /CLAUDE.md at 200.
# The Compare branch deploy, carrying this rule, returned 404 x3 for /CLAUDE.md
# and 404 for /RESTORE.md AT THE SAME MOMENT production still returned 200 for
# both. Same file, same name, same commit content — only the rule differs.
# Controls on that deploy: / 200, /robots.txt 200, /no-such-xyz 404.
#
# ⚠️ A branch deploy is FREE. That is how this was proven without spending 15
# credits on production. Use the same trick next time a redirect needs proving.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/RESTORE.md"
  to = "/404.html"
  status = 404
  force = true

# --- PWA ---------------------------------------------------------------
# The service worker must never be cached, or a stale copy can pin the site
# to an old version long after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# --- About-section ring photos -----------------------------------------
# assets/board/board-NN{,-sm}.{avif,webp} are content-addressed by hand: a
# given filename always holds the same photo, because replacing a photo means
# running tools/make-board-photo.py at a NEW number, never overwriting an old
# one. That makes them safe to cache for a year and mark immutable, so a
# returning visitor re-downloads none of them.
#
# ⚠️ The corollary, and the way this bites: if you ever DO overwrite an
# existing board-NN file in place, anyone who has already visited keeps the old
# photo for up to a year and no deploy will shift it. Always add at a new
# number. The generator script picks the next free one for you by default,
# which is precisely why it does that.
[[headers]]
  for = "/assets/board/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- the functions source, and the config -------------------------------
# ⚠️ SIXTH TIME. tests/, tools/, claude/, CLAUDE.md and RESTORE.md each got one
# of these once somebody noticed; netlify/ was never considered. No publish
# directory is set, so the repo root IS the deployed site — and `functions =
# "netlify/functions"` points INSIDE it. Netlify's own documentation says to
# keep the functions directory outside the publish directory precisely so the
# source is not served as part of the site.
#
# This is the one directory in the repo whose source IS security logic:
# _auth.js (session signing and the revocation check), _intake.js (the
# CLUB_FORM_KEY gate), _googleAuth.js. The repo is public, so this discloses
# nothing new to anyone who thinks to look on github.com — but "already public
# elsewhere" is not a reason to serve it from the site as well.
#
# netlify.toml itself is served for the same reason, and it is the file that
# names the /register-club silent link. package.json exposes the exact
# dependency ranges to anyone fingerprinting for a known-vulnerable version.
#
# ⚠️ `to` MUST be a different path — a redirect pointing at itself is silently
# DROPPED by Netlify rather than applied. That mistake sat unnoticed on the
# tests/ rule for months while the comment above it claimed otherwise.
#
# ⚠️ NOT YET VERIFIED ON A DEPLOY. Per this file's own standard, prove it by
# fetching /netlify/functions/_auth.js on a BRANCH deploy (free) and checking
# for 404 WHILE an unruled sibling still returns 200 — a 404 alone proves
# nothing, because a file that is simply absent 404s identically.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
